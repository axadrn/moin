name: moin deploy
description: Deploy with moin from GitHub Actions, the pushed commit or an image built in CI.
branding:
  icon: upload-cloud
  color: gray-dark
inputs:
  url:
    description: The hub URL.
    required: true
  token:
    description: A personal API token with write access. Store it as a secret.
    required: true
  app:
    description: The app to deploy. Default x-moin.app in compose.yml or the repo name.
    required: false
  image:
    description: Deploy this image, built and pushed earlier in the job, instead of the repo.
    required: false
  commit:
    description: The commit whose compose.yml an image deploy takes. Default the commit of the run; empty for an app that follows no repo.
    required: false
    default: ${{ github.sha }}
runs:
  using: composite
  steps:
    - name: Install moin
      shell: bash
      run: |
        case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64 | arm64) arch=arm64 ;; esac
        curl -fsSL "${{ inputs.url }}/download/moin-linux-$arch" -o "$RUNNER_TEMP/moin"
        chmod 755 "$RUNNER_TEMP/moin"
    - name: Deploy
      shell: bash
      env:
        MOIN_URL: ${{ inputs.url }}
        MOIN_TOKEN: ${{ inputs.token }}
        APP: ${{ inputs.app }}
        IMAGE: ${{ inputs.image }}
        COMMIT: ${{ inputs.commit }}
      run: |
        args=(deploy --yes)
        [ -n "$IMAGE" ] && args+=(--image "$IMAGE")
        [ -n "$IMAGE" ] && [ -n "$COMMIT" ] && args+=(--ref "$COMMIT")
        [ -n "$APP" ] && args+=("$APP")
        "$RUNNER_TEMP/moin" "${args[@]}"
