# The site at moin.run. Its settings are in .env next to this file, and
# COMPOSE_FILE there adds compose.tunnel.yml. stable is the newest release.
services:
  cloud:
    image: ${MOIN_IMAGE:-ghcr.io/axadrn/moin:stable}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: https://${DOMAIN:?set DOMAIN in .env}
    # Only this machine reaches the port. The tunnel serves the site to
    # the internet, with HTTPS on DOMAIN.
    ports:
      - "127.0.0.1:8090:8090"
    # The database of moin cloud, data/cloud.db, outlives the container.
    volumes:
      - ./data:/app/data
