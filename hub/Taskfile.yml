version: "3"

tasks:
  templ:
    desc: Run templ with integrated server and hot reload
    requires:
      vars: [APP_PORT, DEV_PORT, OPEN_BROWSER]
    env:
      APP_URL: 'http://localhost:{{.DEV_PORT}}'
      PORT: '{{.APP_PORT}}'
    cmds:
      - go tool templ generate --watch --log-level=warn --cmd="go run ./cmd/server" --proxy="http://localhost:{{.APP_PORT}}" --proxyport="{{.DEV_PORT}}" --proxybind="0.0.0.0" --open-browser="{{.OPEN_BROWSER}}"

  fmt:
    desc: Format every .go and .templ file
    dir: ..
    cmds:
      - git ls-files --cached --others --exclude-standard "*.go" | grep -v _templ.go | xargs gofmt -w
      # Twice: the first pass can leave what only the second settles.
      - go tool templ fmt hub
      - go tool templ fmt hub

  dev:
    desc: Start development server with hot reload
    vars:
      APP_PORT:
        sh: go run ./cmd/devport {{if .APP_PORT}}-port '{{.APP_PORT}}'{{else}}-start 8090{{end}}
      DEV_PORT:
        sh: go run ./cmd/devport {{if .DEV_PORT}}-port '{{.DEV_PORT}}'{{else}}-start 7331{{end}}
      OPEN_BROWSER: '{{.OPEN_BROWSER | default "false"}}'
    cmds:
      - task: dev:info
        vars:
          APP_PORT: '{{.APP_PORT}}'
          DEV_PORT: '{{.DEV_PORT}}'
      - task: dev:run
        vars:
          APP_PORT: '{{.APP_PORT}}'
          DEV_PORT: '{{.DEV_PORT}}'
          OPEN_BROWSER: '{{.OPEN_BROWSER}}'

  dev:info:
    internal: true
    silent: true
    cmds:
      - 'echo "Local: http://localhost:{{.DEV_PORT}} (app: localhost:{{.APP_PORT}})"'

  dev:run:
    internal: true
    deps:
      - task: templ
        vars:
          APP_PORT: '{{.APP_PORT}}'
          DEV_PORT: '{{.DEV_PORT}}'
          OPEN_BROWSER: '{{.OPEN_BROWSER}}'
