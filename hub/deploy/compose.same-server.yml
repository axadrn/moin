# The hub on the same server as your apps. It joins the network of the
# daemon's Traefik, which serves it on DOMAIN with HTTPS, like any app.
# The router name has an underscore, which no app name has, so no app
# takes it over.
services:
  hub:
    networks: [default, moin-proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: moin-proxy
      traefik.http.routers.moin_hub.rule: Host(`${DOMAIN}`)
      traefik.http.routers.moin_hub.entrypoints: websecure
      traefik.http.services.moin_hub.loadbalancer.server.port: "8090"

networks:
  moin-proxy:
    external: true
