# The moin hub. Its settings are in .env next to this file: compose reads
# it, and so does the hub. COMPOSE_FILE there adds the files of your setup.
# The database lives in /var/lib/moin-hub. stable is the newest release.
services:
  hub:
    image: ${MOIN_IMAGE:-ghcr.io/axadrn/moin:stable}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: https://${DOMAIN:?set DOMAIN in .env}
    volumes:
      - /var/lib/moin-hub:/app/data
      # Files the settings point to, such as the GitHub App key.
      - /etc/moin-hub:/run/moin-hub:ro
    # Only this machine reaches the port. Traefik or the tunnel serves the
    # hub to the internet.
    ports:
      - "127.0.0.1:8090:8090"
