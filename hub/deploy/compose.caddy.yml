# The hub on its own server, with Caddy in front of it. Caddy takes ports
# 80 and 443, gets a certificate for DOMAIN from Let's Encrypt and passes
# every request on to the hub, WebSockets and streams too. It has no
# access to Docker.
services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to hub:8090
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # The certificates.
      - caddy:/data

volumes:
  caddy:
