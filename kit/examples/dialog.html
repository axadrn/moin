<div class="kit-list">
  <button type="button" class="kit-item" data-open-dialog="demo-dialog" aria-haspopup="dialog">
    <span class="kit-strong">Open the dialog</span>
  </button>
</div>
<dialog id="demo-dialog" class="kit-dialog" aria-labelledby="demo-dialog-title">
  <div class="kit-stack" style="--gap:1.25rem">
    <div class="kit-stack" data-gap="1">
      <h2 id="demo-dialog-title" class="kit-heading">Stop my-app?</h2>
      <p class="kit-text kit-muted">It goes offline until you start it.</p>
    </div>
    <div class="kit-dialog-buttons">
      <button type="button" class="kit-button" data-close-dialog>Cancel</button>
      <button type="button" class="kit-button" data-kind="danger" data-close-dialog>Stop</button>
    </div>
  </div>
</dialog>
