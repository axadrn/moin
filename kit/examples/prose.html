<article class="kit-prose">
  <h1>Deploy your first app</h1>
  <p>Connect a server, point it at a repository, and <a href="#kit">push</a>. That is all of it.</p>
  <h2>Before you start</h2>
  <ul>
    <li>A server with SSH access</li>
    <li>A repository with a <code>Dockerfile</code></li>
  </ul>
  <pre><code>moin deploy my-app</code></pre>
  <blockquote>The first deploy takes a minute. The next ones take seconds.</blockquote>
</article>
