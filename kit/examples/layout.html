<div class="kit-stack" data-gap="4">

    <span class="kit-badge">kit-stack</span>

  </div>
  <div class="kit-row" data-gap="2">
    <span class="kit-badge">kit-row</span>
    <span class="kit-badge">next to each other</span>
    <span class="kit-badge kit-end">kit-end</span>
  </div>

    <span class="kit-badge kit-fill kit-center">kit-fill takes the rest</span>
