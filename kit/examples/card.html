<div class="kit-grid">
  <section class="kit-card">
    <div class="kit-card-head">
      <h2 class="kit-heading">A card</h2>
    </div>
    <p class="kit-text kit-muted">A fact, never a sentence about the UI.</p>
  </section>
  <section class="kit-card">
    <div class="kit-card-head">
      <h2 class="kit-heading">With an action</h2>
      <button type="button" class="kit-button">Edit</button>
    </div>
    <div class="kit-command">
      <code>moin deploy my-app</code>
      <button type="button" class="kit-copy" data-copy="moin deploy my-app" aria-label="Copy the command">
        <i class="kit-icon kit-icon-copy"></i>
      </button>
    </div>
  </section>
  <form class="kit-card">
    <div class="kit-card-head">
      <div class="kit-stack" data-gap="1">
        <h2 class="kit-heading">With a line and a foot</h2>
        <p class="kit-small kit-muted">Links to the old name stop working.</p>
      </div>
    </div>
    <div class="kit-field">
      <label for="demo-card-name">Name</label>
      <input id="demo-card-name" class="kit-input" value="my-app">
    </div>
    <div class="kit-card-foot">
      <button type="button" class="kit-button">Cancel</button>
      <button type="button" class="kit-button" data-kind="primary">Save</button>
    </div>
  </form>
  <section class="kit-card">
    <span class="kit-small kit-muted">Just a number</span>
    <span class="kit-number">96 MB</span>
  </section>
</div>
