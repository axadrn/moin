<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <div class="kit-stack kit-center" data-gap="2">
        <h1 class="kit-title">Simple pricing</h1>
        <p class="kit-muted">Start free. Pay when it grows.</p>
      </div>
      <!-- Cards -->
      <div class="kit-grid" data-cols="3">
        <section class="kit-card">
          <div class="kit-stack" data-gap="1">
            <h2 class="kit-heading">Free</h2>
            <span class="kit-number">$0</span>
          </div>
          <p class="kit-text kit-muted">For one person trying it out.</p>
          <button type="button" class="kit-button">Start free</button>
        </section>
        <section class="kit-card">
          <div class="kit-stack" data-gap="1">
            <h2 class="kit-heading">Pro</h2>
            <span class="kit-number">$12</span>
          </div>
          <p class="kit-text kit-muted">For one person who ships.</p>
          <button type="button" class="kit-button" data-kind="primary">Go Pro</button>
        </section>
        <section class="kit-card">
          <div class="kit-stack" data-gap="1">
            <h2 class="kit-heading">Team</h2>
            <span class="kit-number">$48</span>
          </div>
          <p class="kit-text kit-muted">For five people and their work.</p>
          <button type="button" class="kit-button">Start a team</button>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
