<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Changelog</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-main">
          <h1 class="kit-title">Changelog</h1>
        </div>
      </header>
      <!-- Releases -->
      <section class="kit-card">
        <ol class="kit-timeline">
          <li>
            <span class="kit-strong">v1.2 · Teams</span>
            <span class="kit-text kit-muted">Invite people, share everything.</span>
          </li>
          <li>
            <span class="kit-strong">v1.1 · Backups</span>
            <span class="kit-text kit-muted">Copies on a schedule, checked every day.</span>
          </li>
          <li>
            <span class="kit-strong">v1.0 · Hello</span>
            <span class="kit-text kit-muted">The first release.</span>
          </li>
        </ol>
      </section>
    </section>
  </main>
</body>
</html>
