<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-main">
          <h1 class="kit-title">Alfama House</h1>
          <p class="kit-header-line kit-muted">Lisbon · 4.8 out of 5</p>
        </div>
      </header>
      <!-- Dates -->
      <div class="kit-list">
        <details class="kit-expand" open>
          <summary>
            <span class="kit-fill kit-truncate">Dates</span>
            <span class="kit-item-value" data-date>Nov 20 – Nov 23</span>
            <i class="kit-chevron"></i>
          </summary>
          <div>
            <div class="kit-item">
              <kit-calendar range months="2" min="2026-11-09" value="2026-11-20,2026-11-23"></kit-calendar>
            </div>
          </div>
        </details>
      </div>
      <!-- Guests -->
      <div class="kit-field">
        <label for="hotel-guests">Guests</label>
        <div class="kit-select">
          <button type="button" id="hotel-guests" popovertarget="hotel-guests-list" aria-label="Guests" style="anchor-name:--hotel-guests">
            <span class="kit-truncate" data-select-label>2 guests</span>
          </button>
          <div popover id="hotel-guests-list" role="radiogroup" aria-label="Guests" style="position-anchor:--hotel-guests">
            <label class="kit-option">
              <input type="radio" name="guests" value="1">
              <span>1 guest</span>
            </label>
            <label class="kit-option">
              <input type="radio" name="guests" value="2" checked>
              <span>2 guests</span>
            </label>
            <label class="kit-option">
              <input type="radio" name="guests" value="3">
              <span>3 guests</span>
            </label>
            <label class="kit-option">
              <input type="radio" name="guests" value="4">
              <span>4 guests</span>
            </label>
          </div>
        </div>
      </div>
      <!-- Room -->
      <form class="kit-section">
        <div class="kit-section-head">
          <h2>Room</h2>
        </div>
        <div class="kit-list">
          <label class="kit-item">
            <input type="radio" name="room">
            <span class="kit-item-text">
              <span class="kit-item-name">Courtyard room</span>
              <span class="kit-item-note">Queen bed · Free cancellation</span>
            </span>
            <span class="kit-item-value">$142 a night</span>
            <i class="kit-item-check"></i>
          </label>
          <label class="kit-item">
            <input type="radio" name="room" checked>
            <span class="kit-item-text">
              <span class="kit-item-name">River room</span>
              <span class="kit-item-note">King bed · Free cancellation</span>
            </span>
            <span class="kit-item-value">$186 a night</span>
            <i class="kit-item-check"></i>
          </label>
          <label class="kit-item">
            <input type="radio" name="room">
            <span class="kit-item-text">
              <span class="kit-item-name">Roof suite</span>
              <span class="kit-item-note">King bed · Terrace</span>
            </span>
            <span class="kit-item-value">$264 a night</span>
            <i class="kit-item-check"></i>
          </label>
        </div>
      </form>
      <!-- Actions -->
      <div class="kit-row">
        <button type="button" class="kit-button kit-end" data-kind="primary">Reserve</button>
      </div>
    </section>
  </main>
</body>
</html>
