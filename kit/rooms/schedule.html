<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-main">
          <h1 class="kit-title">Calendar</h1>
        </div>
      </header>
      <!-- Cards -->
      <div class="kit-grid" data-cols="1-2">
        <div class="kit-card">
          <kit-calendar value="2026-11-09"></kit-calendar>
        </div>
        <div class="kit-section">
          <div class="kit-section-head">
            <h2>Monday, November 9</h2>
          </div>
          <div class="kit-list">
            <a href="#schedule" class="kit-item">
              <div class="kit-item-text">
                <div class="kit-item-name">Standup</div>
                <div class="kit-item-note">09:30, 15 minutes</div>
              </div>
              <i class="kit-chevron"></i>
            </a>
            <a href="#schedule" class="kit-item">
              <div class="kit-item-text">
                <div class="kit-item-name">Design review</div>
                <div class="kit-item-note">14:00, 1 hour</div>
              </div>
              <i class="kit-chevron"></i>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
