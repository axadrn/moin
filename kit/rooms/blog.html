<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-main">
          <h1 class="kit-title">Blog</h1>
        </div>
      </header>
      <!-- List -->
      <div class="kit-list">
        <a href="#blog" class="kit-item">
          <div class="kit-item-text">
            <div class="kit-item-name">Why we left the framework behind</div>
            <div class="kit-item-note">November 3, 2026 · 4 minutes</div>
          </div>
          <i class="kit-chevron"></i>
        </a>
        <a href="#blog" class="kit-item">
          <div class="kit-item-text">
            <div class="kit-item-name">One binary, no surprises</div>
            <div class="kit-item-note">October 12, 2026 · 6 minutes</div>
          </div>
          <i class="kit-chevron"></i>
        </a>
        <a href="#blog" class="kit-item">
          <div class="kit-item-text">
            <div class="kit-item-name">How backups really work</div>
            <div class="kit-item-note">September 30, 2026 · 8 minutes</div>
          </div>
          <i class="kit-chevron"></i>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
