<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-back"></div>
        <div class="kit-header-main">
          <h1 class="kit-title">2 things need you.</h1>
          <p class="kit-header-line kit-muted">7 apps · 3 servers · every backup checked today</p>
        </div>
      </header>
      <!-- Needs you -->
      <div class="kit-section">
        <div class="kit-section-head">
          <h2>Needs you</h2>
        </div>
        <div class="kit-list">
          <a href="#deploys" class="kit-item">
            <span data-lead class="kit-bubble">
              <i class="kit-icon kit-icon-failed" data-size="s"></i>
            </span>
            <div class="kit-item-text">
              <div class="kit-item-name">blog</div>
              <div class="kit-item-note">v13 failed, v12 still runs</div>
            </div>
            <i class="kit-chevron"></i>
          </a>
          <a href="#overview" class="kit-item">
            <span data-lead class="kit-bubble" style="--tint:var(--running)">
              <i class="kit-icon kit-icon-disk" data-size="s"></i>
            </span>
            <div class="kit-item-text">
              <div class="kit-item-name">web-2</div>
              <div class="kit-item-note">Disk is 91% full</div>
            </div>
            <i class="kit-chevron"></i>
          </a>
        </div>
      </div>
      <!-- Pinned -->
      <div class="kit-section">
        <div class="kit-section-head">
          <h2>Pinned</h2>
        </div>
        <div class="kit-list">
          <a href="#app" class="kit-item">
            <div class="kit-item-text">
              <div class="kit-item-name">my-app</div>
            </div>
            <span class="kit-status" title="Live">
              <i class="kit-dot" data-state="live"></i>
              <span class="kit-sr-only">Live</span>
            </span>
            <i class="kit-chevron"></i>
          </a>
        </div>
      </div>
      <!-- Deployed last -->
      <div class="kit-section">
        <div class="kit-section-head">
          <h2>Deployed last</h2>
        </div>
        <div class="kit-list">
          <a href="#deploys" class="kit-item">
            <div class="kit-item-text">
              <div class="kit-item-name">blog</div>
              <div class="kit-item-note">v12 still runs</div>
            </div>
            <span class="kit-chip" data-state="failed">
              <i class="kit-dot" data-state="failed"></i>
              <span>v13 failed</span>
            </span>
            <i class="kit-chevron"></i>
          </a>
          <a href="#app" class="kit-item">
            <div class="kit-item-text">
              <div class="kit-item-name">docs</div>
            </div>
            <span class="kit-chip" data-state="running">
              <i class="kit-dot" data-state="running"></i>
              <span>Deploying v8</span>
            </span>
            <i class="kit-chevron"></i>
          </a>
          <a href="#app" class="kit-item">
            <div class="kit-item-text">
              <div class="kit-item-name">shop</div>
            </div>
            <span class="kit-status" title="Live">
              <i class="kit-dot" data-state="live"></i>
              <span class="kit-sr-only">Live</span>
            </span>
            <i class="kit-chevron"></i>
          </a>
        </div>
      </div>
      <!-- List -->
      <div class="kit-list">
        <a href="#apps" class="kit-item">
          <div class="kit-item-text">
            <div class="kit-item-name">All apps</div>
          </div>
          <span class="kit-item-value">7</span>
          <i class="kit-chevron"></i>
        </a>
        <a href="#overview" class="kit-item">
          <div class="kit-item-text">
            <div class="kit-item-name">All servers</div>
          </div>
          <span class="kit-item-value">3</span>
          <i class="kit-chevron"></i>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
