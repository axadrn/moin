<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-back">
          <a href="#apps" class="kit-back">Apps</a>
        </div>
        <div class="kit-header-main">
          <h1 class="kit-title">my-app</h1>
          <p class="kit-header-line">
            <i class="kit-dot" data-state="live"></i>
            <span>Live · v12</span>
          </p>
          <div class="kit-header-actions">
            <button type="button" class="kit-button">Restart</button>
            <button type="button" class="kit-button" data-kind="primary">Deploy</button>
          </div>
        </div>
      </header>
      <!-- Desktop only -->
      <div class="kit-hidden-phone">
        <nav class="kit-tabs" aria-label="my-app">
          <a href="#app" class="kit-tab" aria-current="page">App</a>
          <a href="#deploys" class="kit-tab">Deploys</a>
          <a href="#domains" class="kit-tab">Domains</a>
          <a href="#app" class="kit-tab">Logs</a>
          <a href="#data" class="kit-tab">Data</a>
          <a href="#app-settings" class="kit-tab">Settings</a>
        </nav>
      </div>
      <!-- Phone only -->
      <div class="kit-only-phone">
        <div class="kit-list">
          <a href="#deploys" class="kit-item">
            <div class="kit-item-text">
              <div class="kit-item-name">Deploys</div>
            </div>
            <span class="kit-item-value">v12 live</span>
            <i class="kit-chevron"></i>
          </a>
          <a href="#domains" class="kit-item">
            <div class="kit-item-text">
              <div class="kit-item-name">Domains</div>
            </div>
            <span class="kit-item-value">2</span>
            <i class="kit-chevron"></i>
          </a>
          <a href="#app" class="kit-item">
            <div class="kit-item-text">
              <div class="kit-item-name">Logs</div>
            </div>
            <i class="kit-chevron"></i>
          </a>
          <a href="#data" class="kit-item">
            <div class="kit-item-text">
              <div class="kit-item-name">Data</div>
            </div>
            <span class="kit-item-value">postgres-db</span>
            <i class="kit-chevron"></i>
          </a>
          <a href="#app-settings" class="kit-item">
            <div class="kit-item-text">
              <div class="kit-item-name">Settings</div>
            </div>
            <i class="kit-chevron"></i>
          </a>
        </div>
      </div>
      <!-- Cards -->
      <div class="kit-grid">
        <section class="kit-card">
          <div class="kit-card-head">
            <h2 class="kit-heading">CPU</h2>
            <a href="#metrics" class="kit-button">Metrics</a>
          </div>
          <kit-chart values="30.0,35.9,41.2,45.2,47.6,48.4,47.7,45.9,43.7,41.7,40.3,40.0,40.8,42.5,44.8,47.0,48.6,48.9,47.7,44.8,40.4,34.9,28.9,23.1,18.1,14.6,12.6,12.3,13.3,15.2,17.3,19.0,20.0,19.8,18.6,16.5,14.1,11.9,10.6,10.7,12.4,15.7,20.5,26.3,32.3,37.9,42.4,45.5,47.0,46.9,45.6,43.7,41.8,40.3,39.9,40.5,42.2,44.5,47.0,49.1,50.1,49.6,47.4,43.6,38.5,32.6,26.7,21.3,17.2,14.6,13.6,14.0,15.5,17.4,19.1,20.1,20.2,19.1,17.0,14.4,11.9,10.0,9.3,10.3,13.0,17.2,22.6,28.5,34.4,39.4,43.1,45.2,45.8,45.0,43.4,41.6" unit="%" top="100" start-hour="9"></kit-chart>
        </section>
        <div class="kit-stack">
          <div class="kit-list">
            <a href="#domains" class="kit-item">
              <div class="kit-item-text">
                <div class="kit-item-name">my-app.example.com</div>
                <div class="kit-item-note">99.98% in the last 24 hours</div>
              </div>
              <i class="kit-chevron"></i>
            </a>
            <a href="#backups" class="kit-item">
              <div class="kit-item-text">
                <div class="kit-item-name">Backups</div>
                <div class="kit-item-note">Checked today · hourly</div>
              </div>
              <i class="kit-chevron"></i>
            </a>
            <div class="kit-item">
              <div class="kit-item-text">
                <div class="kit-item-name">Server</div>
              </div>
              <span class="kit-item-value">web-1</span>
            </div>
            <div class="kit-item">
              <div class="kit-item-text">
                <div class="kit-item-name">Commit</div>
              </div>
              <span class="kit-item-value kit-mono">8c41f2a</span>
            </div>
          </div>
          <div class="kit-command">
            <code>moin logs my-app --follow</code>
            <button type="button" class="kit-copy" data-copy="moin logs my-app --follow" aria-label="Copy the command">
              <i class="kit-icon kit-icon-copy"></i>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
