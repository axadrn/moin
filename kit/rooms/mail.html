<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mail</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-main">
          <h1 class="kit-title">Inbox</h1>
          <div class="kit-header-actions">
            <button type="button" class="kit-button" data-kind="primary">Write</button>
          </div>
        </div>
      </header>
      <!-- Cards -->
      <div class="kit-grid" data-cols="1-2">
        <div class="kit-list">
          <a href="#mail" class="kit-item" aria-current="true">
            <div class="kit-item-text">
              <div class="kit-item-name">Grace Hopper</div>
              <div class="kit-item-note">Your invoice for November</div>
            </div>
          </a>
          <a href="#mail" class="kit-item">
            <div class="kit-item-text">
              <div class="kit-item-name">Alan Turing</div>
              <div class="kit-item-note">Notes from the review</div>
            </div>
          </a>
          <a href="#mail" class="kit-item">
            <div class="kit-item-text">
              <div class="kit-item-name">Ada Lovelace</div>
              <div class="kit-item-note">Welcome to the team</div>
            </div>
          </a>
        </div>
        <article class="kit-card">
          <div class="kit-stack" data-gap="1">
            <h2 class="kit-heading">Your invoice for November</h2>
            <p class="kit-small kit-muted">Grace Hopper · Today at 08:41</p>
          </div>
          <hr class="kit-separator">
          <div class="kit-prose">
            <p>Hi Ada,</p>
            <p>your invoice is ready. It comes to $48 and is due on December 1.</p>
            <p>Thanks,<br>Grace</p>
          </div>
          <div class="kit-card-foot">
            <button type="button" class="kit-button">Forward</button>
            <button type="button" class="kit-button" data-kind="primary">Reply</button>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
