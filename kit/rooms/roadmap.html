<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roadmap</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-main">
          <h1 class="kit-title">Roadmap</h1>
        </div>
      </header>
      <!-- Cards -->
      <div class="kit-grid" data-cols="3">
        <section class="kit-card">
          <div class="kit-card-head">
            <h2 class="kit-heading">Now</h2>
          </div>
          <ol class="kit-timeline">
            <li>
              <span class="kit-strong">Teams</span>
              <span class="kit-small kit-muted">Shipping in November</span>
            </li>
            <li>
              <span class="kit-strong">Audit log</span>
              <span class="kit-small kit-muted">In review</span>
            </li>
          </ol>
        </section>
        <section class="kit-card">
          <div class="kit-card-head">
            <h2 class="kit-heading">Next</h2>
          </div>
          <ol class="kit-timeline">
            <li>
              <span class="kit-strong">Webhooks</span>
              <span class="kit-small kit-muted">December</span>
            </li>
            <li>
              <span class="kit-strong">Single sign-on</span>
              <span class="kit-small kit-muted">January</span>
            </li>
          </ol>
        </section>
        <section class="kit-card">
          <div class="kit-card-head">
            <h2 class="kit-heading">Later</h2>
          </div>
          <ol class="kit-timeline">
            <li>
              <span class="kit-strong">Mobile app</span>
              <span class="kit-small kit-muted">Next year</span>
            </li>
          </ol>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
