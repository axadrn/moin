<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <main>
    <section class="kit-centered">
      <!-- Logo -->
      <header class="kit-page">
        <span class="kit-heading">acme</span>
      </header>
      <!-- Reset your password -->
      <div>
        <div>
          <h1 class="kit-title kit-center">Reset your password</h1>
          <div class="kit-stack" data-gap="3">
            <div class="kit-field">
              <label for="reset-email">Email</label>
              <input id="reset-email" class="kit-input" type="email" placeholder="ada@example.com" autocomplete="off">
            </div>
            <button type="button" class="kit-button" data-kind="primary">Send me a link</button>
          </div>
          <p class="kit-small kit-muted kit-center">The link works for one hour.</p>
        </div>
      </div>
      <!-- Footer -->
      <footer>
        <a href="#reset">Terms</a>
        <a href="#reset">Privacy</a>
      </footer>
    </section>
  </main>
</body>
</html>
