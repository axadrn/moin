<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domains</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-back">
          <a href="#app" class="kit-back">my-app</a>
        </div>
        <div class="kit-header-main">
          <h1 class="kit-title">Domains</h1>
        </div>
      </header>
      <!-- List -->
      <div class="kit-list">
        <a href="#metrics" class="kit-item">
          <div class="kit-item-text">
            <div class="kit-item-name">my-app.example.com</div>
            <div class="kit-item-note">99.98% · 182 ms</div>
          </div>
          <span class="kit-chip" data-state="live">
            <i class="kit-dot" data-state="live"></i>
            <span>Up</span>
          </span>
          <i class="kit-chevron"></i>
        </a>
        <a href="#metrics" class="kit-item">
          <div class="kit-item-text">
            <div class="kit-item-name">www.example.com</div>
            <div class="kit-item-note">Waiting for its DNS record</div>
          </div>
          <span class="kit-chip" data-state="waiting">
            <i class="kit-dot" data-state="waiting"></i>
            <span>Waiting</span>
          </span>
          <i class="kit-chevron"></i>
        </a>
      </div>
      <!-- Uptime, 30 days -->
      <section class="kit-card">
        <div class="kit-row" data-between>
          <h2 class="kit-heading">Uptime, 30 days</h2>
          <span class="kit-text kit-muted kit-digits">99.8%</span>
        </div>
        <div class="kit-history" role="img" aria-label="30 days, one with an outage" >
          <i data-tip="Oct 10 · 100%"></i>
          <i data-tip="Oct 11 · 100%"></i>
          <i data-tip="Oct 12 · 100%"></i>
          <i data-tip="Oct 13 · 100%"></i>
          <i data-tip="Oct 14 · 100%"></i>
          <i data-tip="Oct 15 · 100%"></i>
          <i data-tip="Oct 16 · 100%"></i>
          <i data-tip="Oct 17 · 100%"></i>
          <i data-tip="Oct 18 · 100%"></i>
          <i data-tip="Oct 19 · 100%"></i>
          <i data-tip="Oct 20 · 100%"></i>
          <i data-tip="Oct 21 · 100%"></i>
          <i data-tip="Oct 22 · 100%"></i>
          <i data-tip="Oct 23 · 100%"></i>
          <i data-tip="Oct 24 · 100%"></i>
          <i data-tip="Oct 25 · 100%"></i>
          <i data-tip="Oct 26 · 100%"></i>
          <i data-tip="Oct 27 · 100%"></i>
          <i data-tip="Oct 28 · 100%"></i>
          <i data-tip="Oct 29 · 100%"></i>
          <i data-tip="Oct 30 · 100%"></i>
          <i data-state="failed" data-tip="Oct 31 · down 48m"></i>
          <i data-tip="Nov 1 · 100%"></i>
          <i data-tip="Nov 2 · 100%"></i>
          <i data-tip="Nov 3 · 100%"></i>
          <i data-tip="Nov 4 · 100%"></i>
          <i data-tip="Nov 5 · 100%"></i>
          <i data-tip="Nov 6 · 100%"></i>
          <i data-tip="Nov 7 · 100%"></i>
          <i data-tip="Nov 8 · 100%"></i>
        </div>
      </section>
      <!-- Add a domain -->
      <div class="kit-section">
        <div class="kit-section-head">
          <h2>Add a domain</h2>
        </div>
        <form class="kit-card">
          <div class="kit-field">
            <label for="add-domain">Domain</label>
            <div class="kit-row" data-gap="2" data-phone="stack">
              <input id="add-domain" class="kit-input" placeholder="my-app.example.com">
              <button type="button" class="kit-button" data-kind="primary">Add</button>
            </div>
          </div>
          <div class="kit-field">
            <label for="bad-domain">Another one</label>
            <input id="bad-domain" class="kit-input" value="example" aria-invalid="true">
            <p class="kit-hint" data-invalid>Not a domain.</p>
          </div>
        </form>
      </div>
      <!-- List -->
      <div class="kit-list">
        <div class="kit-item" data-control>
          <label for="instant" class="kit-item-text">
            <span class="kit-item-name">Instant HTTPS address</span>
            <span class="kit-item-note">my-app.203-0-113-9.nip.io</span>
          </label>
          <span class="kit-switch">
            <input id="instant" type="checkbox" role="switch" checked>
            <span></span>
          </span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
