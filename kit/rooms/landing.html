<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Hero -->
      <div class="kit-stack kit-center" data-gap="3">
        <h1 class="kit-title">Ship your work, not your tools.</h1>
        <p class="kit-muted">Everything your team needs, on one calm page.</p>
        <div class="kit-row" data-gap="2" data-wrap data-center>
          <button type="button" class="kit-button" data-kind="primary">Get started</button>
          <button type="button" class="kit-button">Read the docs</button>
        </div>
      </div>
      <!-- Cards -->
      <div class="kit-grid" data-cols="3">
        <section class="kit-card">
          <h2 class="kit-heading">Fast</h2>
          <p class="kit-text kit-muted">Pages that load before you notice.</p>
        </section>
        <section class="kit-card">
          <h2 class="kit-heading">Simple</h2>
          <p class="kit-text kit-muted">Nothing to learn, nothing to set up.</p>
        </section>
        <section class="kit-card">
          <h2 class="kit-heading">Yours</h2>
          <p class="kit-text kit-muted">Your data stays on your servers.</p>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
