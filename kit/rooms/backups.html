<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backups</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-back">
          <a href="#data" class="kit-back">postgres-db</a>
        </div>
        <div class="kit-header-main">
          <h1 class="kit-title">Backups</h1>
          <p class="kit-header-line">
            <i class="kit-dot" data-state="live"></i>
            <span>Checked today, it restores</span>
          </p>
          <div class="kit-header-actions">
            <button type="button" class="kit-button" data-kind="primary">Back up now</button>
          </div>
        </div>
      </header>
      <!-- Cards -->
      <div class="kit-grid" data-fit style="--min:9rem">
        <div class="kit-card">
          <span class="kit-small kit-muted">Copies</span>
          <span class="kit-number">48</span>
        </div>
        <div class="kit-card">
          <span class="kit-small kit-muted">Newest</span>
          <span class="kit-number">12m ago</span>
        </div>
        <div class="kit-card">
          <span class="kit-small kit-muted">In your bucket</span>
          <span class="kit-number">96 MB</span>
        </div>
      </div>
      <!-- Restore a copy -->
      <div class="kit-section">
        <div class="kit-section-head">
          <h2>Restore a copy</h2>
        </div>
        <form class="kit-stack" data-gap="3">
          <div class="kit-list">
            <label class="kit-item">
              <input type="radio" name="copy">
              <span class="kit-item-text">
                <span class="kit-item-name">Nov 8, 09:00 UTC</span>
                <span class="kit-item-note">Hourly · 2.1 MB</span>
              </span>
              <i class="kit-item-check"></i>
            </label>
            <label class="kit-item">
              <input type="radio" name="copy" checked>
              <span class="kit-item-text">
                <span class="kit-item-name">Nov 8, 08:00 UTC</span>
                <span class="kit-item-note">Hourly · 2.0 MB</span>
              </span>
              <i class="kit-item-check"></i>
            </label>
            <label class="kit-item">
              <input type="radio" name="copy">
              <span class="kit-item-text">
                <span class="kit-item-name">Nov 7, 23:12 UTC</span>
                <span class="kit-item-note">By hand · 1.9 MB</span>
              </span>
              <i class="kit-item-check"></i>
            </label>
            <details class="kit-expand">
              <summary>
                <span class="kit-fill kit-truncate">45 more</span>
                <i class="kit-chevron"></i>
              </summary>
              <div>
                <label class="kit-item">
                  <input type="radio" name="copy">
                  <span class="kit-item-text">
                    <span class="kit-item-name">Nov 7, 22:00 UTC</span>
                    <span class="kit-item-note">Hourly · 1.9 MB</span>
                  </span>
                  <i class="kit-item-check"></i>
                </label>
              </div>
            </details>
          </div>
          <div class="kit-row" data-end>
            <button type="button" class="kit-button" data-kind="danger" data-confirm="Restore over the live data? The data of the last 2 hours goes away." data-confirm-name="postgres-db">Restore</button>
          </div>
        </form>
      </div>
      <!-- Schedule -->
      <div class="kit-section">
        <div class="kit-section-head">
          <h2>Schedule</h2>
        </div>
        <div class="kit-list">
          <div class="kit-item" data-control>
            <label for="every" class="kit-item-text">
              <span class="kit-item-name">Back up</span>
            </label>
            <div class="kit-select">
              <button type="button" id="every" popovertarget="every-list" aria-label="Back up" style="anchor-name:--every">
                <span class="kit-truncate" data-select-label>Every hour</span>
              </button>
              <div popover id="every-list" role="radiogroup" aria-label="Back up" style="position-anchor:--every">
                <label class="kit-option">
                  <input type="radio" name="every" checked>
                  <span>Every hour</span>
                </label>
                <label class="kit-option">
                  <input type="radio" name="every">
                  <span>Every day</span>
                </label>
                <label class="kit-option">
                  <input type="radio" name="every">
                  <span>Every week</span>
                </label>
              </div>
            </div>
          </div>
          <div class="kit-item" data-control>
            <label for="check" class="kit-item-text">
              <span class="kit-item-name">Daily check</span>
              <span class="kit-item-note">Restores the newest copy to see that it works</span>
            </label>
            <span class="kit-switch">
              <input id="check" type="checkbox" role="switch" autocomplete="off" checked>
              <span></span>
            </span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
