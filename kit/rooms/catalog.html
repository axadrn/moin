<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-back">
          <a href="#apps" class="kit-back">Apps</a>
        </div>
        <div class="kit-header-main">
          <h1 class="kit-title">Catalog</h1>
        </div>
      </header>
      <!-- Search -->
      <input class="kit-input" type="search" placeholder="Find an app to install" aria-label="Find an app to install">
      <!-- Cards -->
      <div class="kit-grid">
        <div class="kit-list">
          <a href="#catalog" class="kit-item">
            <span data-lead class="kit-logo">P</span>
            <div class="kit-item-text">
              <div class="kit-item-name">Plausible</div>
              <div class="kit-item-note">Web analytics</div>
            </div>
            <i class="kit-chevron"></i>
          </a>
          <a href="#catalog" class="kit-item">
            <span data-lead class="kit-logo">G</span>
            <div class="kit-item-text">
              <div class="kit-item-name">Ghost</div>
              <div class="kit-item-note">Publishing</div>
            </div>
            <i class="kit-chevron"></i>
          </a>
          <a href="#catalog" class="kit-item">
            <span data-lead class="kit-logo">N</span>
            <div class="kit-item-text">
              <div class="kit-item-name">n8n</div>
              <div class="kit-item-note">Workflows</div>
            </div>
            <i class="kit-chevron"></i>
          </a>
        </div>
        <div class="kit-list">
          <a href="#catalog" class="kit-item">
            <span data-lead class="kit-logo">M</span>
            <div class="kit-item-text">
              <div class="kit-item-name">Metabase</div>
              <div class="kit-item-note">Charts from your data</div>
            </div>
            <i class="kit-chevron"></i>
          </a>
          <a href="#catalog" class="kit-item">
            <span data-lead class="kit-logo">U</span>
            <div class="kit-item-text">
              <div class="kit-item-name">Umami</div>
              <div class="kit-item-note">Web analytics</div>
            </div>
            <i class="kit-chevron"></i>
          </a>
          <a href="#catalog" class="kit-item">
            <span data-lead class="kit-logo">V</span>
            <div class="kit-item-text">
              <div class="kit-item-name">Vaultwarden</div>
              <div class="kit-item-note">Passwords</div>
            </div>
            <i class="kit-chevron"></i>
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
