<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-main">
          <h1 class="kit-title">General</h1>
          <p class="kit-header-line kit-muted">3 people</p>
        </div>
      </header>
      <!-- List -->
      <div class="kit-list">
        <div class="kit-item">
          <span data-lead class="kit-avatar">
            <span aria-hidden="true">GH</span>
          </span>
          <div class="kit-item-text">
            <div class="kit-item-name">Grace Hopper</div>
            <p class="kit-text kit-muted">The new build is live on staging.</p>
          </div>
          <span class="kit-item-value">09:12</span>
        </div>
        <div class="kit-item">
          <span data-lead class="kit-avatar">
            <span aria-hidden="true">AT</span>
          </span>
          <div class="kit-item-text">
            <div class="kit-item-name">Alan Turing</div>
            <p class="kit-text kit-muted">Looks good. Backups ran too.</p>
          </div>
          <span class="kit-item-value">09:15</span>
        </div>
        <div class="kit-item">
          <span data-lead class="kit-avatar">
            <span aria-hidden="true">AL</span>
          </span>
          <div class="kit-item-text">
            <div class="kit-item-name">Ada Lovelace</div>
            <p class="kit-text kit-muted">Then let's ship it.</p>
          </div>
          <span class="kit-item-value">09:16</span>
        </div>
      </div>
      <!-- Actions -->
      <div class="kit-row" data-gap="2">
        <input class="kit-input" placeholder="Write a message" aria-label="Message">
        <button type="button" class="kit-button" data-kind="primary">Send</button>
      </div>
    </section>
  </main>
</body>
</html>
