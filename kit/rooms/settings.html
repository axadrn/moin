<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-main">
          <h1 class="kit-title">Settings</h1>
        </div>
      </header>
      <!-- Profile -->
      <form class="kit-card">
        <div class="kit-card-head">
          <h2 class="kit-heading">Profile</h2>
        </div>
        <div class="kit-field">
          <label for="settings-name">Name</label>
          <input id="settings-name" class="kit-input" value="Ada Lovelace">
        </div>
        <div class="kit-field">
          <label for="settings-email">Email</label>
          <input id="settings-email" class="kit-input" type="email" value="ada@example.com">
        </div>
        <div class="kit-field">
          <label for="settings-avatar">Picture</label>
          <input id="settings-avatar" class="kit-file" type="file">
        </div>
        <div class="kit-card-foot">
          <button type="button" class="kit-button" data-kind="primary">Save</button>
        </div>
      </form>
      <!-- Notifications -->
      <div class="kit-section">
        <div class="kit-section-head">
          <h2>Notifications</h2>
        </div>
        <div class="kit-list">
          <div class="kit-item" data-control>
            <label for="settings-mail" class="kit-item-text">
              <span class="kit-item-name">Email</span>
            </label>
            <span class="kit-switch">
              <input id="settings-mail" type="checkbox" role="switch" checked>
              <span></span>
            </span>
          </div>
          <div class="kit-item" data-control>
            <label for="settings-push" class="kit-item-text">
              <span class="kit-item-name">Push</span>
            </label>
            <span class="kit-switch">
              <input id="settings-push" type="checkbox" role="switch">
              <span></span>
            </span>
          </div>
        </div>
      </div>
      <!-- List -->
      <div class="kit-list">
        <button type="button" class="kit-item" data-danger>
          <span class="kit-strong">Delete account</span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
