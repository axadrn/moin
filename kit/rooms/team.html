<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-main">
          <h1 class="kit-title">Team</h1>
          <p class="kit-header-line kit-muted">3 people, 2 seats free</p>
        </div>
      </header>
      <!-- Invite -->
      <div class="kit-card">
        <div class="kit-row" data-gap="2" data-phone="stack">
          <input class="kit-input" type="email" placeholder="name@example.com" aria-label="Email">
          <button type="button" class="kit-button" data-kind="primary">Invite</button>
        </div>
      </div>
      <!-- List -->
      <div class="kit-list">
        <a href="#team" class="kit-item">
          <span data-lead class="kit-avatar">
            <span aria-hidden="true">AL</span>
          </span>
          <div class="kit-item-text">
            <div class="kit-item-name">Ada Lovelace</div>
            <div class="kit-item-note">ada@example.com</div>
          </div>
          <span class="kit-chip" data-state="live">
            <span>Owner</span>
          </span>
          <i class="kit-chevron"></i>
        </a>
        <a href="#team" class="kit-item">
          <span data-lead class="kit-avatar">
            <span aria-hidden="true">GH</span>
          </span>
          <div class="kit-item-text">
            <div class="kit-item-name">Grace Hopper</div>
            <div class="kit-item-note">grace@example.com</div>
          </div>
          <span class="kit-chip">
            <span>Admin</span>
          </span>
          <i class="kit-chevron"></i>
        </a>
        <a href="#team" class="kit-item">
          <span data-lead class="kit-avatar">
            <span aria-hidden="true">AT</span>
          </span>
          <div class="kit-item-text">
            <div class="kit-item-name">Alan Turing</div>
            <div class="kit-item-note">Invited 2 days ago</div>
          </div>
          <span class="kit-chip" data-state="waiting">
            <span>Waiting</span>
          </span>
          <i class="kit-chevron"></i>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
