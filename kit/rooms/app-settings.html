<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App settings</title>
  <link rel="stylesheet" href="../kit.css">
  <script src="../kit.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="kit-bar">
    <div class="kit-page kit-bar-inner">
      <a href="#" class="kit-row" data-gap="2" aria-label="Home">
        <span class="kit-heading">Acme</span>
      </a>
      <span class="kit-fill"></span>
      <button type="button" class="kit-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="kit-icon kit-icon-theme"></i>
      </button>
      <span class="kit-avatar">
        <span aria-hidden="true">AL</span>
        <span class="kit-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="kit-page kit-content">
      <!-- Title -->
      <header class="kit-header">
        <div class="kit-header-back">
          <a href="#app" class="kit-back">my-app</a>
        </div>
        <div class="kit-header-main">
          <h1 class="kit-title">Settings</h1>
          <div class="kit-header-actions">
            <span class="kit-text kit-muted">2 changes waiting</span>
            <button type="button" class="kit-button" data-kind="primary">Restart</button>
          </div>
        </div>
      </header>
      <!-- App -->
      <div class="kit-section">
        <div class="kit-section-head">
          <h2>App</h2>
        </div>
        <div class="kit-list">
          <a href="#app-settings" class="kit-item">
            <div class="kit-item-text">
              <div class="kit-item-name">Name</div>
            </div>
            <span class="kit-item-value">my-app</span>
            <i class="kit-chevron"></i>
          </a>
          <a href="#app-settings" class="kit-item">
            <div class="kit-item-text">
              <div class="kit-item-name">Repository</div>
            </div>
            <span class="kit-item-value">acme/my-app</span>
            <i class="kit-chevron"></i>
          </a>
          <div class="kit-item" data-control>
            <label for="pin" class="kit-item-text">
              <span class="kit-item-name">Pin to the top</span>
            </label>
            <span class="kit-switch">
              <input id="pin" type="checkbox" role="switch" autocomplete="off" checked>
              <span></span>
            </span>
          </div>
          <div class="kit-item" data-control>
            <label for="auto" class="kit-item-text">
              <span class="kit-item-name">Deploy on push</span>
              <span class="kit-item-note">main</span>
            </label>
            <span class="kit-switch">
              <input id="auto" type="checkbox" role="switch" autocomplete="off">
              <span></span>
            </span>
          </div>
        </div>
      </div>
      <!-- Environment -->
      <div class="kit-section">
        <div class="kit-section-head">
          <h2>Environment</h2>
          <div class="kit-choice" role="radiogroup" aria-label="Edit as" data-size="s">
            <label><input type="radio" name="env" checked>Text</label>
            <label><input type="radio" name="env">Fields</label>
          </div>
        </div>
        <form class="kit-card">
          <textarea class="kit-textarea" aria-label="Environment" spellcheck="false">PORT=8080
  LOG_LEVEL=info
  DATABASE_URL=postgres://postgres-db:5432/app</textarea>
          <div class="kit-row" data-end>
            <button type="button" class="kit-button" data-kind="primary" onclick="this.dataset.done='';setTimeout(()=>delete this.dataset.done,1600)">
              <span>Save</span>
            </button>
          </div>
        </form>
      </div>
      <!-- List -->
      <div class="kit-list">
        <button type="button" class="kit-item" data-danger data-confirm="Stop my-app? It goes offline until you start it.">
          <span class="kit-strong">Stop</span>
        </button>
        <button type="button" class="kit-item" data-danger data-confirm="Remove my-app? Its data goes too. This cannot be undone." data-confirm-name="my-app">
          <span class="kit-strong">Remove</span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
