# The control plane on the same server as the apps. update.sh adds this file
# when the settings say SAME_SERVER=true and the agent's proxy runs: the
# control plane joins the proxy's network, and Traefik serves it on the
# domain of APP_URL with a certificate from Let's Encrypt, like any app.
# MOIN_DOMAIN and MOIN_PROXY_NETWORK come from update.sh: the network is
# moin-proxy.
# The router name has an underscore, which no app name has, so an app can
# never take it over.
services:
  controlplane:
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${MOIN_PROXY_NETWORK:-moin-proxy}
      traefik.http.routers.moin_controlplane.rule: "Host(`${MOIN_DOMAIN:?set APP_URL}`)"
      traefik.http.routers.moin_controlplane.entrypoints: websecure
      traefik.http.services.moin_controlplane.loadbalancer.server.port: "8090"

networks:
  proxy:
    name: ${MOIN_PROXY_NETWORK:-moin-proxy}
    external: true
