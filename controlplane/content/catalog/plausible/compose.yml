x-ops:
  service: web
  port: 8000
  health: /api/health

services:
  web:
    image: ghcr.io/plausible/community-edition:${VERSION}
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    environment:
      BASE_URL: ${APP_URL}
      SECRET_KEY_BASE: ${SECRET_KEY}${SECRET_KEY_MORE}
      DATABASE_URL: postgres://plausible:${DB_PASSWORD}@db:5432/plausible
      CLICKHOUSE_DATABASE_URL: http://events:8123/plausible_events
      HTTP_PORT: "8000"
      DISABLE_REGISTRATION: invite_only
    depends_on:
      db:
        condition: service_healthy
      events:
        condition: service_healthy
  events:
    image: clickhouse/clickhouse-server:24.12-alpine
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
  db:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plausible -d plausible"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      POSTGRES_USER: plausible
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: plausible
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
