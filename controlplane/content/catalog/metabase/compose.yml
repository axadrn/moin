x-ops:
  service: web
  port: 3000
  health: /api/health

services:
  web:
    image: metabase/metabase:${VERSION}
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: metabase
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
