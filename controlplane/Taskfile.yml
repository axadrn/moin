version: "3"

tasks:
  templ:
    desc: Run templ with integrated server and hot reload
    requires:
      vars: [APP_PORT, DEV_PORT, OPEN_BROWSER, S3_PORT]
    vars:
      # The same S3 code as production, against devs3. S3=remote keeps the
      # S3 settings of .env, for example a real R2 dev bucket.
      S3_ENV: '{{if ne .S3 "remote"}}env S3_ENDPOINT=http://127.0.0.1:{{.S3_PORT}} S3_REGION=us-east-1 S3_ACCESS_KEY=dev S3_SECRET_KEY=dev {{end}}'
    env:
      APP_URL: 'http://localhost:{{.DEV_PORT}}'
      PORT: '{{.APP_PORT}}'
    cmds:
      - go tool templ generate --watch --log-level=warn --cmd="{{.S3_ENV}}go run ./cmd/server/main.go" --proxy="http://localhost:{{.APP_PORT}}" --proxyport="{{.DEV_PORT}}" --proxybind="0.0.0.0" --open-browser="{{.OPEN_BROWSER}}"

  devs3:
    desc: Run the local S3 server of task dev
    cmds:
      - '{{if eq .S3 "remote"}}echo "S3 from .env"{{else}}go run ./cmd/devs3 -port {{.S3_PORT | default "9000"}}{{end}}'

  tailwind:
    desc: Watch Tailwind CSS changes
    cmds:
      - tailwindcss -i ./assets/css/globals.css -o ./assets/css/output.css --watch
  dev:
    desc: Start development server with hot reload
    vars:
      APP_PORT:
        sh: go run ./cmd/devport {{if .APP_PORT}}-port '{{.APP_PORT}}'{{else}}-start 8090{{end}}
      DEV_PORT:
        sh: go run ./cmd/devport {{if .DEV_PORT}}-port '{{.DEV_PORT}}'{{else}}-start 7331{{end}}
      S3_PORT:
        sh: go run ./cmd/devport {{if .S3_PORT}}-port '{{.S3_PORT}}'{{else}}-start 9000{{end}}
      OPEN_BROWSER: '{{.OPEN_BROWSER | default "false"}}'
    cmds:
      - task: dev:info
        vars:
          APP_PORT: '{{.APP_PORT}}'
          DEV_PORT: '{{.DEV_PORT}}'
          S3_PORT: '{{.S3_PORT}}'
      - task: dev:run
        vars:
          APP_PORT: '{{.APP_PORT}}'
          DEV_PORT: '{{.DEV_PORT}}'
          S3_PORT: '{{.S3_PORT}}'
          S3: '{{.S3}}'
          OPEN_BROWSER: '{{.OPEN_BROWSER}}'

  dev:info:
    internal: true
    silent: true
    cmds:
      - 'echo "Local: http://localhost:{{.DEV_PORT}} (app: localhost:{{.APP_PORT}}, S3: 127.0.0.1:{{.S3_PORT}})"'

  dev:run:
    internal: true
    deps:
      - task: tailwind
      - task: devs3
        vars:
          S3_PORT: '{{.S3_PORT}}'
          S3: '{{.S3}}'
      - task: templ
        vars:
          APP_PORT: '{{.APP_PORT}}'
          DEV_PORT: '{{.DEV_PORT}}'
          S3_PORT: '{{.S3_PORT}}'
          S3: '{{.S3}}'
          OPEN_BROWSER: '{{.OPEN_BROWSER}}'
