        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No server with this ID or name belongs to the account.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.name`: not 1 to 63 lowercase letters, digits or dashes starting with a letter or digit, or taken in the workspace.'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Servers]
      operationId: deleteServer
      summary: Remove a server
      description: Disconnects its agent. The agent token stops working. The agent stays installed on the machine until you run `uninstall_command` there; it is empty when no agent ever connected.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The server is removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemovedServer'

        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No server with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_has_apps`. The server is online and has apps: remove them first. An offline server goes with its apps.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/servers/{id}/install:
    parameters:
      - $ref: '#/components/parameters/ServerID'
    post:
      tags: [Servers]
      operationId: newInstallCommand
      summary: New install command
      description: A new install token and command for the server, shown this once, for one hour; ops stores only a fingerprint of it. The old install command stops working. An agent that registers with it takes over the server, and the agent token of the old one stops working.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '201':
          description: The server and its new install command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedServer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No server with this ID or name belongs to the account.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/servers/{id}/update:
    parameters:
      - $ref: '#/components/parameters/ServerID'
    post:
      tags: [Servers]
      operationId: updateAgent
      summary: Update the agent of a server
      description: The agent downloads the binary this control plane serves for its OS and CPU, from the control plane URL it is registered with, checks it against the SHA-256 the control plane sends, swaps it in and restarts through systemd. The answer comes once the new agent is connected, within three minutes. An agent refuses while a deploy runs, without systemd, and when its server has rules in `/etc/ops/rules`; agents older than the update say so with the command that updates them on the server.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The server with the new agent version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No server with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`, or `no_agent_binary` when the control plane serves no binary for the server.'
        '424':
          $ref: '#/components/responses/AgentError'
        '500':
          $ref: '#/components/responses/Internal'

