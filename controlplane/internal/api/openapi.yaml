  /api/v1/apps/{app}/deploys:
    parameters:
      - $ref: '#/components/parameters/AppName'
    post:
      tags: [Apps]
      operationId: createDeploy
      summary: Deploy
      description: 'Starts a deploy. `{"upload": "...", "sha256": "..."}` deploys a source the CLI put into your bucket through createUpload; the server downloads it, checks the SHA-256 and deletes it from the bucket. `{"image": "..."}` deploys an image built elsewhere with the compose file of the running release. `{"ref": "main"}` has the server download that branch, tag or commit of the linked GitHub repo; `{}` deploys the linked branch. ops never stores your code. Follow the deploy with its events.'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                upload:
                  type: string
                  example: up_9x2k4m...
                sha256:
                  type: string
                image:
                  type: string
                  example: ghcr.io/me/blog:3f2a9c1
                ref:
                  type: string
                  example: main
      responses:
        '202':
          description: The started deploy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deploy'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`, `deploy_running` while another deploy of the app runs, `no_bucket` for an upload without a bucket, `no_repo` for a ref without a linked repo.'
        '415':
          $ref: '#/components/responses/Conflict'
          description: '`update_ops`: a gzipped body from an old CLI; sources go to your bucket now.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.upload`, `fields.image` or `fields.ref`.'
        '500':
          $ref: '#/components/responses/Internal'

