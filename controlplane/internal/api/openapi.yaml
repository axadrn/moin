          description: The domain with its new settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UptimeDomain'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `domain` when the app has no such domain, or `path` when it does not start with /.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/restore:
    parameters:
      - $ref: '#/components/parameters/AppName'
    post:
      tags: [Backups]
      operationId: restoreApp
      summary: Restore a database
      description: Puts a database back from a snapshot, or as it was at a point in time. The agent takes a snapshot of the current state first, checks the restored file, stops the app for the swap and starts it again. Point in time history starts again from the restored state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '204':
          description: The database is restored and the app runs again.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`no_backups` without a bucket, `server_offline`.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.snapshot`.'
        '424':
          $ref: '#/components/responses/AgentError'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/backup-storage:
    get:
      tags: [Backups]
      operationId: getBackupStorage
      summary: Get the bucket
      description: The S3-compatible bucket backups go to, without its secret key.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupStorage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`no_backups` when no bucket is set up.'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [Backups]
      operationId: setBackupStorage
      summary: Set the bucket
      description: Checks that ops can write to the bucket, stores it with the secret key encrypted and tells every online server to back up there. Empty endpoint means AWS S3; Cloudflare R2, Backblaze B2, Hetzner and other S3-compatible stores take their endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupStorageRequest'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupStorage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.endpoint`, `fields.bucket` or `fields.secret_key`.'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Backups]
      operationId: deleteBackupStorage
      summary: Remove the bucket
      description: Agents stop backing up. What is in the bucket stays.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '204':
          description: The bucket is forgotten.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`no_backups` when no bucket is set up.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/github:
    get:
      tags: [GitHub]
      operationId: getGitHub
      summary: GitHub connection
      description: Where the ops GitHub App is installed, the link that connects GitHub, and the link that installs it on another account or organization.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The installations.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, installations]
                properties:
                  enabled:
                    type: boolean
                  connect_url:
                    type: string
                    description: Connects GitHub. If the app is already installed, it connects those installations; if not, it installs the app.
                  install_url:
                    type: string
                    description: Installs the app on another account or organization.
                  installations:
                    type: array
                    items:
                      type: object
                      required: [id, account, settings_url]
                      properties:
                        id:
                          type: integer
                        account:
                          type: string
                        settings_url:
                          type: string
                          description: The page on github.com where the account chooses the repos ops may read. For an installation connected before ops kept it, the install link, which leads there too.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/github/repos:
    get:
      tags: [GitHub]
      operationId: getGitHubRepos
      summary: List repos
      description: Every repo the user's installations of the ops GitHub App may read.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The repos.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [full_name, default_branch, private, account]
                      properties:
                        full_name:
                          type: string
                        default_branch:
                          type: string
                        private:
                          type: boolean
                        account:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`github_off` when the control plane has no GitHub App.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/github/repos/{owner}/{repo}/branches:
    parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: repo
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [GitHub]
      operationId: getGitHubBranches
      summary: List branches
      description: The branches of a repo ops may read, the default branch first.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The branch names.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`github_off` when the control plane has no GitHub App.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.repo` when ops cannot read the repo.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/repo:
    parameters:
      - $ref: '#/components/parameters/AppName'
    put:
      tags: [GitHub]
      operationId: setAppRepo
      summary: Link a repo
      description: The app follows a repo and branch; an empty branch is the repo's default branch. With `auto_deploy` every push to the branch deploys, and ops writes the result as the commit status `ops/deploy`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties:
                repo:
                  type: string
                  example: me/blog
                branch:
                  type: string
                auto_deploy:
                  type: boolean
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`github_off` when the control plane has no GitHub App.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.repo`, or with `fields.branch` when the repo on GitHub has no branch by this name.'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [GitHub]
      operationId: deleteAppRepo
      summary: Unlink the repo
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '204':
          description: The app follows no repo.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/servers/{id}/security:
    parameters:
      - name: id
        in: path
        required: true
        description: The server's ID or name.
        schema:
          type: string
    put:
      tags: [Servers]
      operationId: setServerSecurity
      summary: Lock down a server
      description: 'How the server is reached: `tunnel` creates a Cloudflare Tunnel with the stored Cloudflare token, routes every app domain through it, points their DNS at it and closes 80 and 443. `ssh_tailscale` joins the tailnet with the stored Tailscale key and answers SSH only there, once Tailscale is up. `firewall` drops every other inbound connection. The agent applies it at once, or when it connects; `security` in the answer says what it set up.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tunnel:
                  type: boolean
                ssh_tailscale:
                  type: boolean
                firewall:
                  type: boolean
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The server with what its agent set up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No server with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`no_cloudflare` or `no_tailscale` when the key is missing.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/integrations:
    get:
      tags: [Servers]
      operationId: getIntegrations
      summary: Get integrations
      description: Whether a Cloudflare API token and a Tailscale auth key are stored. The keys never come back.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The integrations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrations'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [Servers]
      operationId: setIntegrations
      summary: Set integrations
      description: 'Stores the Cloudflare API token, checked against Cloudflare first, and the Tailscale auth key, both encrypted. A missing field keeps its key, an empty one removes it. The token needs Account: Cloudflare Tunnel Edit and Zone: DNS Edit; Zone: Zone Settings Edit is optional and lets ops turn on Always Use HTTPS.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cloudflare_token:
                  type: string
                tailscale_key:
                  type: string
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The integrations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrations'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.cloudflare_token` or `fields.tailscale_key`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/env:
    parameters:
      - $ref: '#/components/parameters/AppName'
    get:
      tags: [Apps]
      operationId: getAppEnv
      summary: Get env vars
      description: In plain text. Tokens need the write scope, because reading secrets is as strong as writing them.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The env vars.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Env'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [Apps]
      operationId: updateAppEnv
      summary: Set env vars
      description: Sets and removes env vars. They are stored encrypted and take effect with the next deploy. A rollback keeps the env of its release.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvRequest'
      responses:
        '200':
          description: All env vars after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Env'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.set`.'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [Apps]
      operationId: replaceAppEnv
      summary: Replace all env vars
      description: Makes the sent env vars the app's, all at once, like one .env file. What is new or changed is set, keys not sent are removed. Answers what changed. They take effect with the next deploy.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceEnvRequest'
      responses:
        '200':
          description: All env vars after the change, and what changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplacedEnv'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.set`.'
        '500':
          $ref: '#/components/responses/Internal'

