      properties:
        id:
          type: string
        actor_user_id:
          type: [string, 'null']
        actor_email:
          type: string
        workspace_id:
          type: [string, 'null']
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        metadata:
          type: string
          description: JSON text with details of the event.
        created_at:
          type: string
          format: date-time
    AdminDashboard:
      type: object
      required: [metrics, users, events]
      properties:
        metrics:
          $ref: '#/components/schemas/AdminMetrics'
        users:
