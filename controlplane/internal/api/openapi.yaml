    post:
      tags: [Apps]
      operationId: createUpload
      summary: Sign an upload
      description: A link valid for 15 minutes that takes a gzipped tar of the source with a PUT, straight into your own bucket. ops signs it with your bucket's key and never sees the code. Deploy it with createDeploy and the upload ID.
      security:
        - bearerAuth: []
        - cookieAuth: []
