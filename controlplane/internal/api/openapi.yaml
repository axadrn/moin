  /api/v1/apps/{app}/databases/rows:
    parameters:
      - $ref: '#/components/parameters/AppName'
    get:
      tags: [Data]
      operationId: getTableRows
      summary: Browse rows
      description: One page of a table, newest rowid first. When the table has a rowid it is the first column. Rows are app data, so tokens need the write scope.
      parameters:
        - name: database
          in: query
          description: The database's path in the container, as listed by getAppDatabases. Default the first one.
          schema:
            type: string
        - name: table
          in: query
          required: true
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          description: 1 to 500. Default 50.
          schema:
            type: integer
            minimum: 1
            maximum: 500
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableRows'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found` for an unknown app or table, `no_database` when the live release has no SQLite database.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`.'
        '424':
          $ref: '#/components/responses/AgentError'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [Data]
      operationId: insertTableRow
      summary: Add a row
      description: Inserts one row. Columns missing from `values` get their default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertRequest'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '201':
          description: The row is added.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found` for an unknown app or table, `no_database` when the live release has no SQLite database.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.column`.'
        '424':
          $ref: '#/components/responses/AgentError'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [Data]
      operationId: updateTableRow
      summary: Edit a cell
      description: Sets one column of one row, found by its rowid. A null value stores NULL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RowRequest'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '204':
          description: The row changed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found` for an unknown app or table, `no_database` when the live release has no SQLite database.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`, `not_editable` for views and WITHOUT ROWID tables.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.column`.'
        '424':
          $ref: '#/components/responses/AgentError'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Data]
      operationId: deleteTableRow
      summary: Delete a row
      description: Deletes one row, found by its rowid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RowRequest'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '204':
          description: The row is gone.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found` for an unknown app or table, `no_database` when the live release has no SQLite database.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`, `not_editable` for views and WITHOUT ROWID tables.'
        '424':
          $ref: '#/components/responses/AgentError'
        '500':
          $ref: '#/components/responses/Internal'

