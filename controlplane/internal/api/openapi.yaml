      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        email_verified_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        workspace_count:
          type: integer
        active_session_count:
          type: integer
        is_admin:
          type: boolean
    AdminUserPage:
      type: object
      required: [items, query, page, total_pages, total_users]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
