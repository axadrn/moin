      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DBResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found` for an unknown app or table, `no_database` when the live release has no SQLite database.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`, or `read_only_query` when a read without `write` changes data.'
