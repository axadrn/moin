    parameters:
      - $ref: '#/components/parameters/WorkspaceSlug'
      - $ref: '#/components/parameters/MemberID'
    delete:
      tags: [Workspaces]
      operationId: removeMember
      summary: Remove a member
      responses:
        '204':
          description: The member is removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. Unknown workspace or member.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`last_owner`. A workspace keeps at least one owner.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/workspaces/{workspaceSlug}/members/{memberID}/role:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlug'
      - $ref: '#/components/parameters/MemberID'
    patch:
      tags: [Workspaces]
      operationId: changeMemberRole
      summary: Change the role of a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '200':
          description: The member with the new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. Unknown workspace or member.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`last_owner`. A workspace keeps at least one owner.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.role`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/workspaces/{workspaceSlug}/leave:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlug'
    post:
      tags: [Workspaces]
      operationId: leaveWorkspace
      summary: Leave a workspace
      responses:
        '204':
          description: The account is no longer a member.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`last_owner`. Hand over ownership first.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/workspaces/{workspaceSlug}/activity:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlug'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceActivity
      summary: List workspace activity
      description: Audit events, newest first. Pass `next_cursor` as `cursor` to read the next page.
      parameters:
        - name: limit
          in: query
          description: Events per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page. Keep the same filters.
          schema:
            type: string
        - name: app
          in: query
          description: Only events of this app, by name.
          schema:
            type: string
        - name: server
          in: query
          description: Only events of this server and of the apps on it, by name.
          schema:
            type: string
        - name: user
          in: query
          description: Only events of this member, by email or user ID.
          schema:
            type: string
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          description: '`invalid_cursor`. Start again without a cursor.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.limit`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/activity:
    get:
      tags: [Workspaces]
      operationId: listActivity
      summary: List activity
      description: What happened in the workspace of the API token, newest first, the same as listWorkspaceActivity, for the CLI: deploys, rollbacks, restores, SQL writes, env, domains, servers, security and member changes. Pass `next_cursor` as `cursor` to read the next page.
      parameters:
        - name: limit
          in: query
          description: Events per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page. Keep the same filters.
          schema:
            type: string
        - name: app
          in: query
          description: Only events of this app, by name.
          schema:
            type: string
        - name: server
          in: query
          description: Only events of this server and of the apps on it, by name.
          schema:
            type: string
        - name: user
          in: query
          description: Only events of this member, by email or user ID.
          schema:
            type: string
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          description: '`invalid_cursor`. Start again without a cursor.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.limit`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/workspaces/{workspaceSlug}/billing:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlug'
    get:
      tags: [Billing]
      operationId: getWorkspaceBilling
      summary: Get the workspace subscription and plans
      description: Only members who may manage billing.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          $ref: '#/components/responses/Billing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/workspaces/{workspaceSlug}/billing/checkout:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlug'
    post:
      tags: [Billing]
      operationId: createWorkspaceCheckout
      summary: Start a checkout for the workspace
      description: Only members who may manage billing. Open the returned URL in a browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProviderURL'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`checkout_pending` while a checkout is being created, `checkout_conflict` when a checkout for another plan is open, `already_paid`.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidCheckout'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/workspaces/{workspaceSlug}/billing/manage:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlug'
    get:
      tags: [Billing]
      operationId: getWorkspaceBillingManagement
      summary: Open billing management for the workspace
      description: Only members who may manage billing. Open the returned URL in a browser.
      responses:
        '200':
          $ref: '#/components/responses/ProviderURL'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
          description: '`forbidden` when the role may not manage billing, `onboarding_required`, or `impersonation_read_only` during impersonation because billing management is a provider session.'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/NoBillingAccount'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      tags: [Invitations]
      operationId: getInvitation
      summary: Preview an invitation
      description: Needs no session. The token comes from the invitation link `APP_URL/workspaces/invitations/{token}`.
      security: []
      responses:
        '200':
          description: The open invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. Unknown token.'
        '410':
          $ref: '#/components/responses/InvitationUnavailable'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: Accept an invitation
      description: Adds the signed-in account to the workspace. The account email must match the invited address.
      responses:
        '200':
          description: The new membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
          description: '`invitation_email_mismatch` when the invitation belongs to another address, `onboarding_required`, `forbidden` for a cookie request without a valid `X-CSRF-Token` header, `impersonation_read_only` during impersonation.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. Unknown token.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`already_member` or `seat_limit`.'
        '410':
          $ref: '#/components/responses/InvitationUnavailable'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/admin/users:
    get:
      tags: [Admin]
      operationId: getAdminDashboard
      summary: Get the admin dashboard
      description: Metrics, one page of users, and the latest audit events.
      parameters:
        - name: query
          in: query
          description: Filters users by email or name, without case.
          schema:
            type: string
        - name: page
          in: query
          description: The page of users, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: The dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/admin/users/{userID}/sessions/revoke:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [Admin]
      operationId: revokeUserSessions
      summary: Sign a user out everywhere
      description: Revokes every session and every personal API token of the user.
      responses:
        '204':
          description: Every session and personal API token of the user is revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. Unknown user.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`admin_self_action`. Use the sessions endpoints for your own account.'
        '500':
          $ref: '#/components/responses/Internal'

  /auth/github:
    get:
      tags: [OAuth]
      operationId: startGitHubSignIn
      summary: Start GitHub sign-in
      description: Open in a browser, not with fetch. Redirects to GitHub, which returns to `API_URL/auth/github/callback`. `API_URL` defaults to `APP_URL`.
      security: []
      responses:
        '307':
          description: Redirect to GitHub.
        '303':
          description: The browser is already signed in and goes to the app.
        '429':
          description: Too many attempts from this client IP.

  /auth/github/callback:
    get:
      tags: [OAuth]
      operationId: finishGitHubSignIn
      summary: Finish GitHub sign-in
      description: GitHub redirects the browser here. On success the browser gets the `session_token` cookie and goes to the app or to onboarding.
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthCode'
        - $ref: '#/components/parameters/OAuthState'
      responses:
        '303':
          description: Signed in. Redirect to the app or to onboarding.
          headers:
            Set-Cookie:
              description: The `session_token` cookie.
              schema:
                type: string
        '200':
          description: Sign-in failed. The sign-in page with the error.
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Too many attempts from this client IP.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The `token` from a sign-in endpoint. It is the session and expires with it.
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_token
      description: The session cookie of a same-site browser frontend. Requests that change state also need the `X-CSRF-Token` header.
    apiTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: pat_
      description: 'A personal API token from `POST /api/v1/account/tokens`, sent as `Authorization: Bearer pat_...`. The role in the security entry of an operation is the scope it needs.'

  parameters:
    SessionMode:
      name: session
      in: query
      required: false
      description: '`cookie` sets the HttpOnly `session_token` cookie and answers without the token. A session the browser already had in that cookie is revoked. Such a request always needs the `X-CSRF-Token` header. Leave it out for a bearer token.'
      schema:
        type: string
        enum: [cookie]
    SessionID:
      name: id
      in: path
      required: true
      description: The session ID from `GET /api/v1/account/sessions`.
      schema:
        type: string
    APITokenID:
      name: id
      in: path
      required: true
      description: The token ID from `GET /api/v1/account/tokens`.
      schema:
        type: string
    ServerID:
      name: id
      in: path
      required: true
      description: The server ID or name from `GET /api/v1/servers`.
      schema:
        type: string
    AppName:
      name: app
      in: path
      required: true
      description: The app ID or name from `GET /api/v1/apps`.
      schema:
        type: string
    DeployNumber:
      name: number
      in: path
      required: true
      description: The deploy number, counted per app.
      schema:
        type: integer
        minimum: 1
    WorkspaceSlug:
      name: workspaceSlug
      in: path
      required: true
      description: The workspace slug. Unknown workspaces and workspaces the account does not belong to answer 404.
      schema:
        type: string
    InvitationID:
      name: invitationID
      in: path
      required: true
      description: The invitation ID from `GET /api/v1/workspaces/{workspaceSlug}`.
      schema:
        type: string
    MemberID:
      name: memberID
      in: path
      required: true
      description: The member ID from `GET /api/v1/workspaces/{workspaceSlug}`.
      schema:
        type: string
    InvitationToken:
      name: token
      in: path
      required: true
      description: The token from the invitation email.
      schema:
        type: string
    UserID:
      name: userID
      in: path
      required: true
      description: The user ID from the admin dashboard.
      schema:
        type: string
    OAuthCode:
      name: code
      in: query
      required: true
      description: The authorization code from the provider.
      schema:
        type: string
    OAuthState:
      name: state
      in: query
      required: true
      description: The state value, checked against the `oauth_state` cookie.
      schema:
        type: string

  responses:
    Session:
      description: 'A new session. Send `token` as `Authorization: Bearer <token>`. With `session=cookie` the answer is a `CookieSession` and the token is only in the cookie.'
      headers:
        Set-Cookie:
          description: The HttpOnly `session_token` cookie, only with `session=cookie`.
          schema:
            type: string
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/SessionToken'
              - $ref: '#/components/schemas/CookieSession'
    InvalidBody:
      description: '`invalid_body`. The body is empty, not valid JSON, has unknown fields, or is larger than 1 MiB.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidToken:
      description: '`invalid_token` when the token is unknown, expired or used, or `invalid_body`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: '`unauthenticated`. No valid session.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`forbidden` for a cookie request without a valid `X-CSRF-Token` header, `impersonation_read_only` during impersonation.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OnboardedForbidden:
      description: '`onboarding_required` until `POST /api/v1/auth/onboarding`, `forbidden` for a cookie request without a valid `X-CSRF-Token` header, `impersonation_read_only` for writes during impersonation.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WorkspaceForbidden:
      description: '`forbidden` when the workspace role does not allow the action or a cookie request has no valid `X-CSRF-Token` header, `onboarding_required`, `impersonation_read_only` for writes during impersonation.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WorkspaceNotFound:
      description: '`not_found`. Unknown workspace, or the account is not a member.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvitationUnavailable:
      description: '`invitation_unavailable`. The invitation expired, was revoked or was used.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AdminForbidden:
      description: '`forbidden` for accounts that are not admins or a cookie request without a valid `X-CSRF-Token` header, `onboarding_required`, `impersonation_read_only` for writes during impersonation.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Billing:
      description: The subscription, its access, and the plans a checkout can start.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Billing'
    ProviderURL:
      description: A URL hosted by the payment provider.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/URLResponse'
    InvalidCheckout:
      description: '`invalid_plan` for an unknown or unpurchasable plan, `invalid_interval` for an interval other than monthly or yearly.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoBillingAccount:
      description: '`no_billing_account`. Start a paid plan first.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`not_found`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AgentError:
      description: '`agent_error`. The agent answered with an error; the message is its own.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: '`unsupported_media_type`. Send the body as `application/json`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: '`validation_failed` with one message per invalid field in `fields`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: '`rate_limited`. Wait for `Retry-After` seconds.'
      headers:
        Retry-After:
          description: Seconds until the limit resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: '`internal`. The error is logged on the server.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable lowercase snake case code.
              examples: [validation_failed]
            message:
              type: string
              description: A sentence for humans.
            fields:
              type: object
              description: One message per invalid field. Present only for `validation_failed`.
              additionalProperties:
                type: string
    CSRFToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
    Meta:
      type: object
      required: [name, support_email, version]
      properties:
        name:
          type: string
          description: The project name.
        support_email:
          type: string
          format: email
          description: The `SUPPORT_EMAIL` address.
        version:
          type: string
          description: The control plane's version, like `v3.2.3`, or `dev`. Agents update to it.
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: The token from the emailed link.
    NameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
    OnboardingRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        workspace_name:
          type: string
          description: The name of the first workspace, 2 to 80 characters. Without it the workspace is called "<name>'s Workspace". Ignored when no workspace is created.
        invitation_token:
          type: string
          description: The token of the workspace invitation the person arrived with. An unknown, used, revoked, expired or foreign invitation is ignored and the default workspace is created.
    PasswordSignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 12
          description: 12 to 72 bytes, not a common password.
    SetPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 12
          description: 12 to 72 bytes, not a common password.
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [confirm_email]
      properties:
        confirm_email:
          type: string
          description: The account email address, compared without case.
    User:
      type: object
      required: [id, email, name, password_set, created_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
          description: Empty until onboarding.
        password_set:
          type: boolean
        created_at:
          type: string
          format: date-time
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    CookieSession:
      type: object
      additionalProperties: false
      required: [expires_at, user]
      description: A sign-in with `session=cookie`. The token is only in the HttpOnly `session_token` cookie.
      properties:
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    SessionToken:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: The bearer token. It is shown once.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    Account:
      type: object
      required: [user, onboarding_required, workspaces, is_admin, avatar_url]
      properties:
        user:
          $ref: '#/components/schemas/User'
        onboarding_required:
          type: boolean
        workspaces:
          type: array
          description: The workspaces of the account. Subscriptions belong to workspaces, see the workspace billing endpoint.
          items:
            $ref: '#/components/schemas/Membership'
        is_admin:
          type: boolean
          description: True when the signed-in session belongs to an operator listed in `ADMIN_EMAILS` with a verified email, on the hosted control plane. False for API tokens, during impersonation and on a self-hosted control plane. The admin endpoints answer 403 when it is false, and 404 on a self-hosted control plane.
        avatar_url:
          type: [string, 'null']
          format: uri
    Session:
      type: object
      required: [id, display_name, current, last_seen_at, created_at]
      properties:
        id:
          type: string
        display_name:
          type: string
          description: Browser and system, for example "Chrome on macOS".
        current:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    APIToken:
      type: object
      required: [id, name, prefix, scopes, workspace_id, last_used_at, expires_at, expired, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: The first 8 characters after `pat_`, to tell tokens apart.
        scopes:
          type: array
          items:
            type: string
            enum: [read, write]
          description: '`["read"]` or `["read", "write"]`.'
        workspace_id:
          type: string
          description: The only workspace the token can reach.
        last_used_at:
          type: [string, 'null']
          format: date-time
          description: Updated at most once a minute.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: '`null` for a token that never expires.'
        expired:
          type: boolean
        created_at:
          type: string
          format: date-time
    Server:
      type: object
      required: [id, name, online, hostname, os, arch, agent_version, last_seen_at, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        online:
          type: boolean
          description: The agent holds a session right now.
        hostname:
          type: string
          description: Reported by the agent. Empty until it registers.
        os:
          type: string
          example: linux
        arch:
          type: string
          example: amd64
        agent_version:
          type: string
        last_seen_at:
          type: [string, 'null']
          format: date-time
          description: The last connect or disconnect. Null before the agent first connected.
        tunnel:
          type: boolean
          description: App traffic comes through a Cloudflare Tunnel; no port is open.
        ssh_tailscale:
          type: boolean
          description: SSH answers only on the user's tailnet.
        firewall:
          type: boolean
          description: Every other inbound connection is dropped.
        security:
          type: [object, 'null']
          description: What the agent set up last.
          properties:
            proxy:
              type: string
              enum: [direct, tunnel]
            tailscale_ip:
              type: string
            firewall:
              type: boolean
            open_ports:
              type: array
              items:
                type: string
            problems:
              type: array
              items:
                type: string
        rules:
          type: [object, 'null']
          description: What the owner of the server allows ops to do there, from /etc/ops/rules on the server. The agent enforces them; the control plane cannot change them. Null without rules.
          properties:
            data_off:
              type: boolean
              description: Tables, SQL and row edits are refused.
            logs_off:
              type: boolean
              description: Container logs are refused.
            deploy_from:
              type: array
              description: The only sources deploys may come from. Empty allows all.
              items:
                type: string
                example: github.com/acme/*
            backups_to:
              type: string
              description: The only bucket backups may go to, as endpoint host and bucket.
              example: s3.eu-central-1.amazonaws.com/acme-backups
            network_locked:
              type: boolean
              description: The tunnel, Tailscale and firewall cannot be changed.
        created_at:
          type: string
          format: date-time
    ServerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Server'
    CreateServerRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
          description: Empty or left out gets a name like `brave-otter`.
    OrderRequest:
      type: object
      required: [order]
      properties:
        order:
          type: array
          description: Every app or server of the workspace once, by name or ID, in the new order.
          items:
            type: string
    RenameServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
    CreatedServer:
      type: object
      required: [server, install_token, install_command, expires_at]
      properties:
        server:
          $ref: '#/components/schemas/Server'
        install_token:
          type: string
          description: Shown this one time.
        install_command:
          type: string
          description: Run it as root on the server, or put sudo before sh.
        expires_at:
          type: string
          format: date-time
    RemovedServer:
      type: object
      required: [uninstall_command, apps]
      properties:
        apps:
          type: array
          items:
            type: string
          description: The apps that went with the server, because it was offline and could not remove them. They stay on the machine with their data if it comes back. Empty for an online server.
        uninstall_command:
          type: string
          description: Run it on the server as root, or with sudo in front, to remove the agent, its binary and state. The apps keep running with their data; add `--apps` to remove them too. Empty when no agent ever connected, so nothing is installed there.
    App:
      type: object
      required: [id, name, server_id, server_name, latest_number, latest_status, live_number, domains, canonical, protected, stopped, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        server_id:
          type: string
        server_name:
          type: string
        latest_number:
          type: integer
          description: The newest deploy. 0 before the first.
        latest_status:
          type: string
          enum: ['', running, succeeded, failed]
        live_number:
          type: integer
          description: The newest successful deploy, which is running. 0 before the first.
        domains:
          type: array
          items:
            type: string
        canonical:
          type: string
          description: The domain the others redirect to. Empty for none.
        protected:
          type: boolean
          description: A password guards the app.
        stopped:
          type: boolean
          description: The app was stopped. A deploy, a restart or a start runs it again.
        repo:
          type: string
          description: The GitHub repo the app follows, as owner/name. Empty for none.
        branch:
          type: string
        auto_deploy:
          type: boolean
          description: Every push to the branch deploys.
        snapshot_before_changes:
          type: boolean
          description: A snapshot before every change made through ops.
        hook:
          type: boolean
          description: The app has a deploy hook URL. The URL itself is shown only once, when it is made.
        created_at:
          type: string
          format: date-time
    AppList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/App'
    AppDetail:
      type: object
      required: [app, deploys]
      properties:
        app:
          $ref: '#/components/schemas/App'
        deploys:
          type: array
          items:
            $ref: '#/components/schemas/Deploy'
    CreateAppRequest:
      type: object
      required: [name, server]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        server:
          type: string
          description: Server ID or name.
    Deploy:
      type: object
      required: [number, status, from_number, image, error, detected, created_at, finished_at]
      properties:
        number:
          type: integer
        status:
          type: string
          enum: [running, succeeded, failed]
        from_number:
          type: integer
          description: For a rollback, the deploy whose release runs again. 0 otherwise.
        image:
          type: string
          description: The image of the main service when it was built elsewhere. Empty for server builds.
        ref:
          type: string
          description: The branch, tag or commit deployed from GitHub.
        commit:
          type: string
          description: The commit SHA deployed from GitHub.
        commit_message:
          type: string
        error:
          type: string
        detected:
          oneOf:
            - $ref: '#/components/schemas/Detected'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        log:
          type: array
          items:
            type: string
          description: Only on `GET /api/v1/apps/{app}/deploys/{number}`.
        on_server:
          type: boolean
          description: Whether the server still keeps the release, so a rollback can go to it. It keeps the releases of the last 5 builds (source or image) and the restarts and rollbacks after the oldest of them. Only in the deploys of `GET /api/v1/apps/{app}`.
    Detected:
      type: object
      description: What the agent found in the repo and on the server.
      required: [kind, service, port, databases]
      properties:
        kind:
          type: string
          enum: [compose, dockerfile, go]
        service:
          type: string
          description: The service that gets the traffic.
        port:
          type: integer
        databases:
          type: array
          items:
            type: object
            required: [path, host_path]
            properties:
              path:
                type: string
                description: Inside the container.
              host_path:
                type: string
        config:
          type: object
          description: The `x-ops` block of compose.yml.
          properties:
            app:
              type: string
            server:
              type: string
            service:
              type: string
            port:
              type: integer
            health:
              type: string
            domains:
              type: array
              items:
                type: string
            database:
              type: string
    Change:
      type: object
      required: [app, deploy]
      properties:
        app:
          $ref: '#/components/schemas/App'
        deploy:
          oneOf:
            - $ref: '#/components/schemas/Deploy'
            - type: 'null'
        unchanged:
          type: boolean
          description: true when the app had it so already; nothing restarts
    DomainsRequest:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          items:
            type: string
          example: [blog.de, www.blog.de]
        canonical:
          type: string
          example: blog.de
    ProtectionRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 72
    DomainChecks:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [domain, canonical, address, ipv4, ipv6, advice, found, points, from_compose]
            properties:
              domain:
                type: string
              canonical:
                type: boolean
              address:
                type: string
                description: The address the domain should point at, the IPv4 when known, else the IPv6, or the tunnel. Empty before the agent connected.
              ipv4:
                type: string
                description: The server's public IPv4, empty when unknown. The domain points here when it resolves to the IPv4 or the IPv6.
              ipv6:
                type: string
                description: The server's public IPv6, empty when unknown.
              advice:
                type: string
                description: The DNS record to set, such as "A record to 203.0.113.7, AAAA record to 2a01:4f8::1".
              found:
                type: array
                items:
                  type: string
              points:
                type: boolean
              from_compose:
                type: boolean
                description: x-ops.domains in compose.yml of the live release sets the domain. It wins over the domains set in ops, so it changes in compose.yml, then a deploy.
    DeployHook:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Shown once. Anyone with it can deploy images to the app.
    Registry:
      type: object
      required: [host, username, created_at]
      properties:
        host:
          type: string
        username:
          type: string
        created_at:
          type: string
          format: date-time
    RegistryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Registry'
    RegistryRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          description: A password or access token with read access to packages.
    RollbackRequest:
      type: object
      properties:
        number:
          type: integer
          minimum: 0
    Databases:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Database'
    Database:
      type: object
      required: [path, host_path]
      properties:
        path:
          type: string
          description: Path in the container.
        host_path:
          type: string
          description: Path on the server.
    DBTables:
      type: object
      required: [database, tables]
      properties:
        database:
          type: string
        tables:
          type: array
          items:
            $ref: '#/components/schemas/DBTable'
        migration:
          type: object
          description: The newest migration that goose, golang-migrate, Prisma or Drizzle recorded. The app runs its migrations; ops only reads where they are.
          required: [tool, version]
          properties:
            tool:
              type: string
              enum: [goose, migrate, prisma, drizzle]
            version:
              type: string
            applied_at:
              type: string
    DBTable:
      type: object
      required: [name, type, rows, rowid, columns]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [table, view]
        rows:
          type: integer
        rowid:
          type: boolean
          description: False for views and WITHOUT ROWID tables, whose rows cannot be edited by rowid.
        sql:
          type: string
          description: The CREATE statement.
        indexes:
          type: array
          items:
            type: string
          description: The CREATE INDEX statements.
        columns:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name:
                type: string
              type:
                type: string
              not_null:
                type: boolean
              primary_key:
                type: boolean
    TableRows:
      type: object
      required: [database, table, columns, rows, offset, limit, truncated]
      properties:
        database:
          type: string
        table:
          $ref: '#/components/schemas/DBTable'
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items: {}
        offset:
          type: integer
        limit:
          type: integer
        truncated:
          type: boolean
          description: True when there are more rows after this page.
    InsertRequest:
      type: object
      required: [table, values]
      properties:
        database:
          type: string
        table:
          type: string
        values:
          type: object
          additionalProperties:
            type: string
    RowRequest:
      type: object
      required: [table, rowid]
      properties:
        database:
          type: string
        table:
          type: string
        rowid:
          type: integer
        column:
          type: string
          description: The column to set. PATCH only.
        value:
          type: [string, 'null']
          description: The new value. PATCH only.
    QueryRequest:
      type: object
      required: [sql]
      properties:
        database:
          type: string
        sql:
          type: string
        params:
          type: array
          items: {}
        write:
          type: boolean
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: Rows a read returns; default 100.
    DBResult:
      type: object
      required: [database, columns, rows]
      properties:
        database:
          type: string
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items: {}
          description: Values are null, numbers or text. A blob that is not text comes as 0x and its hex.
        truncated:
          type: boolean
        changes:
          type: integer
    BackupStorage:
      type: object
      required: [endpoint, region, bucket, path, folder, access_key, created_at]
      properties:
        endpoint:
          type: string
        region:
          type: string
        bucket:
          type: string
        path:
          type: string
        folder:
          type: string
          description: Where this workspace's files are in the bucket, path then the workspace ID, like ops/0b6c1f8e-…/.
        access_key:
          type: string
        created_at:
          type: string
          format: date-time
    BackupStorageRequest:
      type: object
      required: [bucket, access_key, secret_key]
      properties:
        endpoint:
          type: string
          description: https:// URL of an S3-compatible store; empty for AWS S3.
        region:
          type: string
        bucket:
          type: string
        path:
          type: string
          description: An optional folder inside the bucket, only for a bucket that holds other files too.
        access_key:
          type: string
        secret_key:
          type: string
    BackupSettings:
      type: object
      required: [snapshot_before_changes]
      properties:
        snapshot_before_changes:
          type: boolean
    RestoreRequest:
      type: object
      properties:
        database:
          type: string
          description: The database's path in the container; needed when the app has several.
        snapshot:
          type: string
          description: A snapshot ID from getAppBackups.
        at:
          type: string
          format: date-time
          description: A point in time inside the database's window.
    Uptime:
      type: object
      required: [app, state, server, server_online, domains]
      properties:
        app:
          type: string
        state:
          type: string
          enum: [up, down, pending, paused, stopped, no_domains]
          description: down when a domain is down, pending before the first check, paused when every check is.
        server:
          type: string
        server_online:
          type: boolean
        domains:
          type: array
          items:
            $ref: '#/components/schemas/UptimeDomain'
    UptimeDomain:
      type: object
      required: [domain, path, custom_path, paused, state, since, checked_at, status_code, response_ms, error, cert_expires_at, uptime_24h, uptime_7d, uptime_30d, average_ms, outages]
      properties:
        domain:
          type: string
        path:
          type: string
          description: Where the check goes. The app's health path from `x-ops.health`, or /, unless set.
        custom_path:
          type: boolean
        paused:
          type: boolean
        state:
          type: string
          enum: [up, down, pending, paused]
        since:
          type: string
          format: date-time
          nullable: true
        checked_at:
          type: string
          format: date-time
          nullable: true
          description: The newest check since the control plane started.
        status_code:
          type: integer
        response_ms:
          type: integer
        error:
          type: string
          description: Why the newest check failed, such as `HTTP 502` or `no answer within 10s`.
        cert_expires_at:
          type: string
          format: date-time
          nullable: true
        uptime_24h:
          type: number
          nullable: true
          description: Percent of the checks that found it up; null without a check in that time.
        uptime_7d:
          type: number
          nullable: true
        uptime_30d:
          type: number
          nullable: true
        average_ms:
          type: integer
          description: Mean response time of the last 24 hours.
        outages:
          type: array
          description: The last 10, newest first.
          items:
            type: object
            required: [started_at, ended_at, reason]
            properties:
              started_at:
                type: string
                format: date-time
              ended_at:
                type: string
                format: date-time
                nullable: true
              reason:
                type: string
    UptimeCheckRequest:
      type: object
      properties:
        path:
          type: string
          description: A path like /health; empty goes back to the health path or /.
        paused:
          type: boolean
    AppBackups:
      type: object
      required: [snapshot_before_changes, databases]
      properties:
        snapshot_before_changes:
          type: boolean
        databases:
          type: array
          items:
            type: object
            required: [database, snapshots]
            properties:
              database:
                type: string
              snapshots:
                type: array
                items:
                  type: object
                  required: [id, reason, size, created_at]
                  properties:
                    id:
                      type: string
                    reason:
                      type: string
                      description: manual, before-v4, before-sql, before-restore.
                    size:
                      type: integer
                    created_at:
                      type: string
                      format: date-time
              since:
                type: string
                format: date-time
                description: The oldest point a point in time restore can reach.
              replicated_at:
                type: string
                format: date-time
                description: The newest change in the bucket.
              verified_at:
                type: string
                format: date-time
                description: The newest restore drill that passed the integrity check.
              error:
                type: string
    Integrations:
      type: object
      required: [cloudflare, cloudflare_account, tailscale]
      properties:
        cloudflare:
          type: boolean
        cloudflare_account:
          type: string
        tailscale:
          type: boolean
    Logs:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items:
            type: string
    Env:
      type: object
      required: [items]
      properties:
        items:
          type: object
          additionalProperties:
            type: string
    ReplaceEnvRequest:
      type: object
      required: [env]
      properties:
        env:
          type: object
          description: Every env var the app keeps, by key. An empty object removes them all.
          additionalProperties:
            type: string
    ReplacedEnv:
      type: object
      required: [items, added, changed, removed]
      properties:
        items:
          type: object
          additionalProperties:
            type: string
        added:
          type: array
          items:
            type: string
          description: The keys that are new.
        changed:
          type: array
          items:
            type: string
          description: The keys whose value changed.
        removed:
          type: array
          items:
            type: string
          description: The keys that are gone.
    EnvRequest:
      type: object
      properties:
        set:
          type: object
          additionalProperties:
            type: string
        unset:
          type: array
          items:
            type: string
    APITokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/APIToken'
    CreateAPITokenRequest:
      type: object
      required: [name, workspace_id]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: A label such as "Claude Desktop" or "Nightly export".
        scopes:
          type: array
          items:
            type: string
            enum: [read, write]
          description: '`write` includes `read`. Defaults to `["read"]`.'
        expires_in_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
          description: '`null` or missing for a token that never expires.'
        workspace_id:
          type: string
          description: The workspace the token is bound to, one of `GET /api/v1/workspaces`.
    CreatedAPIToken:
      type: object
      required: [token, api_token]
      properties:
        token:
          type: string
          description: 'The raw token, `pat_` and 52 characters. It is shown only in this answer.'
        api_token:
          $ref: '#/components/schemas/APIToken'
    AvatarResponse:
      type: object
      required: [avatar_url]
      properties:
        avatar_url:
          type: [string, 'null']
          format: uri
    Workspace:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
    WorkspaceRole:
      type: string
      enum: [owner, admin, member]
    Membership:
      type: object
      required: [workspace, role]
      properties:
        workspace:
          $ref: '#/components/schemas/Workspace'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    MembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    OnboardingResponse:
      type: object
      required: [user, workspace]
      properties:
        user:
          $ref: '#/components/schemas/User'
        workspace:
          description: The workspace created by onboarding, or null when the account already had one or onboarding came with an available invitation.
          oneOf:
            - $ref: '#/components/schemas/Workspace'
            - type: 'null'
    WorkspaceResponse:
      type: object
      required: [workspace]
      properties:
        workspace:
          $ref: '#/components/schemas/Workspace'
    WorkspaceMember:
      type: object
      required: [id, user_id, name, role, created_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
          description: Present only for members who may manage members.
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        created_at:
          type: string
          format: date-time
    MemberResponse:
      type: object
      required: [member]
      properties:
        member:
          $ref: '#/components/schemas/WorkspaceMember'
    PendingInvitation:
      type: object
      required: [id, email, role, expires_at, created_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    WorkspacePermissions:
      type: object
      required: [manage_workspace, manage_members, manage_owners, manage_billing, delete_workspace, view_audit_log]
      properties:
        manage_workspace:
          type: boolean
        manage_members:
          type: boolean
        manage_owners:
          type: boolean
        manage_billing:
          type: boolean
        delete_workspace:
          type: boolean
        view_audit_log:
          type: boolean
    WorkspaceDetail:
      type: object
      required: [workspace, role, permissions, members, invitations, seats]
      properties:
        workspace:
          $ref: '#/components/schemas/Workspace'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        permissions:
          $ref: '#/components/schemas/WorkspacePermissions'
        members:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'
        invitations:
          type: array
          description: Pending invitations. Empty for members who may not manage members.
          items:
            $ref: '#/components/schemas/PendingInvitation'
        seats:
          type: object
          required: [used, limit]
          properties:
            used:
              type: integer
            limit:
              type: [integer, 'null']
              description: Null when the plan has no member limit.
    InvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
    RoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    WorkspaceEvent:
      type: object
      required: [id, actor_user_id, actor_email, action, target_type, target_id, metadata, actor, summary, via, token, app, server, created_at]
      properties:
        id:
          type: string
        actor_user_id:
          type: [string, 'null']
        actor_email:
          type: string
        action:
          type: string
          examples: [app.deployed, data.sql, backup.restored, workspace.invitation.sent]
        target_type:
          type: string
        target_id:
          type: string
        metadata:
          type: string
          description: 'JSON text with details of the event, such as `{"number":"12","ref":"main"}`, and settings before and after, such as `{"from":"member","to":"admin"}`. Env values, secrets, tokens, passwords, SQL text and row contents are never in it; a SQL write has the kind of statement, its tables and the row count.'
        actor:
          type: string
          description: The member's email, or `GitHub`, `A deploy hook` or `ops` for changes without a member.
          examples: [ada@example.com]
        summary:
          type: string
          description: What happened, to read after the actor.
          examples: [deployed blog v12 from main at 3f2a9c1]
        via:
          type: string
          enum: [web, cli, tui, api, mcp, hook, github, system, '']
          description: How the change came in. `system` is ops itself, such as a deploy that ended or a restore drill. Events from before the CLI and TUI were told apart say `api` for them. Empty for some older events.
        token:
          type: string
          description: The name of the API token the change came with, empty without one.
        app:
          type: string
          description: The app the change touched, by name, empty for none.
        server:
          type: string
          description: The server the change touched, or the server of the app, by name.
        ip:
          type: string
          description: The client IP of the member's request. Only for admins and owners.
        user_agent:
          type: string
          description: The user agent of the member's request. Only for admins and owners.
        created_at:
          type: string
          format: date-time
          description: When it happened, RFC 3339 in UTC with full precision.
    ActivityPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceEvent'
        next_cursor:
          type: [string, 'null']
          description: Null on the last page.
    InvitationPreview:
      type: object
      required: [workspace_name, inviter_name, role, expires_at]
      properties:
        workspace_name:
          type: string
        inviter_name:
          type: string
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        expires_at:
          type: string
          format: date-time
    Subscription:
      type: object
      required: [id, plan_id, status, provider, current_period_end, amount, currency, interval, created_at, updated_at]
      properties:
        id:
          type: string
        plan_id:
          type: string
        status:
          type: string
          enum: [active, trialing, past_due, incomplete, inactive, cancelled, blocked]
        provider:
          type: string
        current_period_end:
          type: [string, 'null']
          format: date-time
        amount:
          type: [integer, 'null']
          description: In the smallest currency unit.
        currency:
          type: string
        interval:
          type: [string, 'null']
          enum: [monthly, yearly, null]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Access:
      type: object
      required: [plan_id, state, trial_ends_at, access_ends_at]
      properties:
        plan_id:
          type: string
        state:
          type: string
          enum: [free, trial, paid, grace, blocked]
        trial_ends_at:
          type: [string, 'null']
          format: date-time
        access_ends_at:
          type: [string, 'null']
          format: date-time
    Plan:
      type: object
      required: [id, name, description, benefits, current, prices]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        benefits:
          type: array
          items:
            type: string
        current:
          type: boolean
          description: True for the plan of the current access.
        prices:
          type: array
          items:
            $ref: '#/components/schemas/PlanPrice'
    PlanPrice:
      type: object
      required: [interval, amount, display_price]
      properties:
        interval:
          type: string
          enum: [monthly, yearly]
        amount:
          type: integer
          description: In the smallest currency unit.
        display_price:
          type: string
    Billing:
      type: object
      required: [subscription, access, plans]
      properties:
        subscription:
          oneOf:
            - $ref: '#/components/schemas/Subscription'
            - type: 'null'
        access:
          oneOf:
            - $ref: '#/components/schemas/Access'
            - type: 'null'
        plans:
          type: array
          description: Plans a checkout can start.
          items:
            $ref: '#/components/schemas/Plan'
    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [plan_id]
      properties:
        plan_id:
          type: string
        interval:
          type: string
          enum: [monthly, yearly]
          default: monthly
    URLResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    AdminMetrics:
      type: object
      required: [users, verified_users, workspaces, paid_workspaces, active_sessions]
      properties:
        users:
          type: integer
        verified_users:
          type: integer
        workspaces:
          type: integer
        paid_workspaces:
          type: integer
        active_sessions:
          type: integer
    AdminUser:
      type: object
