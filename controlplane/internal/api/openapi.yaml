        in: path
        required: true
        description: One of the app's domains.
        schema:
          type: string
    put:
      tags: [Uptime]
      operationId: setUptimeCheck
      summary: Set an uptime check
      description: Changes the path the check of a domain goes to, or pauses and resumes it. A missing field keeps its setting; an empty path goes back to the app's health path, or /. A paused check starts over when it resumes.
