          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/restart:
    parameters:
      - $ref: '#/components/parameters/AppName'
    post:
      tags: [Apps]
      operationId: restartApp
      summary: Restart an app
      description: Starts the live release again with the env vars, domains and protection as they are now, without a build. A stopped app runs again.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '202':
          description: The started deploy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deploy'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`, `deploy_running` or `not_live` before the first deploy.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/start:
    parameters:
      - $ref: '#/components/parameters/AppName'
    post:
      tags: [Apps]
      operationId: startApp
      summary: Start an app
      description: Runs a stopped app again. Like a restart, it takes the env vars, domains and protection as they are now.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '202':
          description: The started deploy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deploy'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`already_running` when the app runs already: nothing changes. `server_offline`, `deploy_running` or `not_live` before the first deploy.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/stop:
    parameters:
      - $ref: '#/components/parameters/AppName'
    post:
      tags: [Apps]
      operationId: stopApp
      summary: Stop an app
      description: Stops the containers of the app. They stay stopped, also after a reboot of the server, until a deploy, a restart or a start. Data and settings stay. Changes to domains and protection wait for the start.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '204':
          description: The app is stopped.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`, `deploy_running` or `not_live` before the first deploy.'
        '424':
          $ref: '#/components/responses/AgentError'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/domains:
    parameters:
      - $ref: '#/components/parameters/AppName'
    get:
      tags: [Apps]
      operationId: checkDomains
      summary: Check domains
      description: Looks up every domain of the app and says whether it points at the address its server's agent connects from.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: One check per domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainChecks'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [Apps]
      operationId: setDomains
      summary: Set domains
      description: 'Replaces the domains and the canonical one, which the others redirect to (empty for none). HTTPS is always on; Traefik gets certificates from Let''s Encrypt. The `x-ops` block of compose.yml wins for every field it sets.'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainsRequest'
      responses:
        '200':
          description: The app, and the deploy that applies the change to the running release; `deploy` is null when the next deploy applies it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`domains_from_compose`. x-ops.domains in compose.yml sets the domains of the live release; change them there and deploy.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.domains` or `fields.canonical`.'
        '500':
          $ref: '#/components/responses/Internal'

