services:
  web:
    image: twinproduction/gatus:${VERSION}
    expose: ["8080"]
    configs:
      - source: gatus
        target: /config/config.yaml
    volumes:
      - ./data:/data

configs:
  gatus:
    content: |
      storage:
        type: sqlite
        path: /data/data.db
      endpoints:
        - name: example
          url: https://example.org
          interval: 5m
          conditions:
            - "[STATUS] == 200"
