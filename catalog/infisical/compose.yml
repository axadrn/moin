services:
  web:
    image: infisical/infisical:${VERSION}
    expose: ["8080"]
    environment:
      NODE_ENV: production
      SITE_URL: ${APP_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY_HEX16}
      AUTH_SECRET: ${AUTH_SECRET}
      DB_CONNECTION_URI: postgres://infisical:${DB_PASSWORD}@db:5432/infisical
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  redis:
    image: redis:8
  db:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: infisical
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
