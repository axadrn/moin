<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apps</title>
  <link rel="stylesheet" href="../moin.css">
  <script src="../moin.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="moin-bar">
    <div class="moin-page moin-bar-inner">
      <a href="#" class="moin-row" data-gap="2" aria-label="Home">
        <span class="moin-heading">Acme</span>
      </a>
      <span class="moin-fill"></span>
      <button type="button" class="moin-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="moin-icon moin-icon-theme"></i>
      </button>
      <span class="moin-avatar">
        <span aria-hidden="true">AL</span>
        <span class="moin-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="moin-page moin-content">
      <!-- Title -->
      <header class="moin-header">
        <div class="moin-header-back">
          <a href="#overview" class="moin-back">Overview</a>
        </div>
        <div class="moin-header-main">
          <h1 class="moin-title">Apps</h1>
          <div class="moin-header-actions">
            <a href="#catalog" class="moin-button" data-kind="primary">New app</a>
          </div>
        </div>
      </header>
      <!-- Search -->
      <input class="moin-input" type="search" placeholder="Find an app" aria-label="Find an app">
      <!-- List -->
      <section class="moin-card">
        <div class="moin-list">
          <a href="#app" class="moin-item">
            <div class="moin-item-text">
              <div class="moin-item-name">my-app</div>
              <div class="moin-item-note">web-1 · my-app.example.com</div>
            </div>
            <span class="moin-status" title="Live">
              <i class="moin-dot" data-state="live"></i>
              <span class="moin-sr-only">Live</span>
            </span>
            <i class="moin-chevron"></i>
          </a>
          <a href="#deploys" class="moin-item">
            <div class="moin-item-text">
              <div class="moin-item-name">blog</div>
              <div class="moin-item-note">web-2 · v12 still runs</div>
            </div>
            <span class="moin-chip" data-state="failed">
              <i class="moin-dot" data-state="failed"></i>
              <span>v13 failed</span>
            </span>
            <i class="moin-chevron"></i>
          </a>
          <a href="#app" class="moin-item">
            <div class="moin-item-text">
              <div class="moin-item-name">docs</div>
              <div class="moin-item-note">web-1</div>
            </div>
            <span class="moin-chip" data-state="running">
              <i class="moin-dot" data-state="running"></i>
              <span>Deploying v8</span>
            </span>
            <i class="moin-chevron"></i>
          </a>
          <a href="#app" class="moin-item">
            <div class="moin-item-text">
              <div class="moin-item-name">shop</div>
              <div class="moin-item-note">web-3 · shop.example.com</div>
            </div>
            <span class="moin-status" title="Live">
              <i class="moin-dot" data-state="live"></i>
              <span class="moin-sr-only">Live</span>
            </span>
            <i class="moin-chevron"></i>
          </a>
          <a href="#app" class="moin-item">
            <div class="moin-item-text">
              <div class="moin-item-name">analytics</div>
              <div class="moin-item-note">web-3</div>
            </div>
            <span class="moin-chip" data-state="idle">
              <i class="moin-dot" data-state="idle"></i>
              <span>Stopped</span>
            </span>
            <i class="moin-chevron"></i>
          </a>
          <a href="#app" class="moin-item">
            <div class="moin-item-text">
              <div class="moin-item-name">playground</div>
              <div class="moin-item-note">web-1</div>
            </div>
            <span class="moin-chip" data-state="idle">
              <i class="moin-dot" data-state="idle"></i>
              <span>New</span>
            </span>
            <i class="moin-chevron"></i>
          </a>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
