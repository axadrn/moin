<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Changelog</title>
  <link rel="stylesheet" href="../moin.css">
  <script src="../moin.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="moin-bar">
    <div class="moin-page moin-bar-inner">
      <a href="#" class="moin-row" data-gap="2" aria-label="Home">
        <span class="moin-heading">Acme</span>
      </a>
      <span class="moin-fill"></span>
      <button type="button" class="moin-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="moin-icon moin-icon-theme"></i>
      </button>
      <span class="moin-avatar">
        <span aria-hidden="true">AL</span>
        <span class="moin-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="moin-page moin-content">
      <!-- Title -->
      <header class="moin-header">
        <div class="moin-header-main">
          <h1 class="moin-title">Changelog</h1>
        </div>
      </header>
      <!-- Releases -->
      <section class="moin-card">
        <ol class="moin-timeline">
          <li>
            <span class="moin-strong">v1.2 · Teams</span>
            <span class="moin-text moin-muted">Invite people, share everything.</span>
          </li>
          <li>
            <span class="moin-strong">v1.1 · Backups</span>
            <span class="moin-text moin-muted">Copies on a schedule, checked every day.</span>
          </li>
          <li>
            <span class="moin-strong">v1.0 · Hello</span>
            <span class="moin-text moin-muted">The first release.</span>
          </li>
        </ol>
      </section>
    </section>
  </main>
</body>
</html>
