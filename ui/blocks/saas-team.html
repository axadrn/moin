<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team</title>
  <link rel="stylesheet" href="../moin.css">
  <script src="../moin.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="moin-bar">
    <div class="moin-page moin-bar-inner">
      <a href="#" class="moin-row" data-gap="2" aria-label="Home">
        <span class="moin-heading">Acme</span>
      </a>
      <span class="moin-fill"></span>
      <button type="button" class="moin-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="moin-icon moin-icon-theme"></i>
      </button>
      <span class="moin-avatar">
        <span aria-hidden="true">AL</span>
        <span class="moin-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="moin-page moin-content">
      <!-- Title -->
      <header class="moin-header">
        <div class="moin-header-main">
          <h1 class="moin-title">Team</h1>
          <p class="moin-header-line moin-muted">3 people, 2 seats free</p>
        </div>
      </header>
      <!-- Invite -->
      <div class="moin-card">
        <div class="moin-row" data-gap="2" data-phone="stack">
          <input class="moin-input" type="email" placeholder="name@example.com" aria-label="Email">
          <button type="button" class="moin-button" data-kind="primary">Invite</button>
        </div>
      </div>
      <!-- List -->
      <section class="moin-card">
        <div class="moin-list">
          <a href="#team" class="moin-item">
            <span data-lead class="moin-avatar">
              <span aria-hidden="true">AL</span>
            </span>
            <div class="moin-item-text">
              <div class="moin-item-name">Ada Lovelace</div>
              <div class="moin-item-note">ada@example.com</div>
            </div>
            <span class="moin-chip" data-state="live">
              <span>Owner</span>
            </span>
            <i class="moin-chevron"></i>
          </a>
          <a href="#team" class="moin-item">
            <span data-lead class="moin-avatar">
              <span aria-hidden="true">GH</span>
            </span>
            <div class="moin-item-text">
              <div class="moin-item-name">Grace Hopper</div>
              <div class="moin-item-note">grace@example.com</div>
            </div>
            <span class="moin-chip">
              <span>Admin</span>
            </span>
            <i class="moin-chevron"></i>
          </a>
          <a href="#team" class="moin-item">
            <span data-lead class="moin-avatar">
              <span aria-hidden="true">AT</span>
            </span>
            <div class="moin-item-text">
              <div class="moin-item-name">Alan Turing</div>
              <div class="moin-item-note">Invited 2 days ago</div>
            </div>
            <span class="moin-chip" data-state="waiting">
              <span>Waiting</span>
            </span>
            <i class="moin-chevron"></i>
          </a>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
