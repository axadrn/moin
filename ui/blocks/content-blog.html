<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <link rel="stylesheet" href="../moin.css">
  <script src="../moin.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="moin-bar">
    <div class="moin-page moin-bar-inner">
      <a href="#" class="moin-row" data-gap="2" aria-label="Home">
        <span class="moin-heading">Acme</span>
      </a>
      <span class="moin-fill"></span>
      <button type="button" class="moin-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="moin-icon moin-icon-theme"></i>
      </button>
      <span class="moin-avatar">
        <span aria-hidden="true">AL</span>
        <span class="moin-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="moin-page moin-content">
      <!-- Title -->
      <header class="moin-header">
        <div class="moin-header-main">
          <h1 class="moin-title">Blog</h1>
        </div>
      </header>
      <!-- List -->
      <section class="moin-card">
        <div class="moin-list">
          <a href="#blog" class="moin-item">
            <div class="moin-item-text">
              <div class="moin-item-name">Why we left the framework behind</div>
              <div class="moin-item-note">November 3, 2026 · 4 minutes</div>
            </div>
            <i class="moin-chevron"></i>
          </a>
          <a href="#blog" class="moin-item">
            <div class="moin-item-text">
              <div class="moin-item-name">One binary, no surprises</div>
              <div class="moin-item-note">October 12, 2026 · 6 minutes</div>
            </div>
            <i class="moin-chevron"></i>
          </a>
          <a href="#blog" class="moin-item">
            <div class="moin-item-text">
              <div class="moin-item-name">How backups really work</div>
              <div class="moin-item-note">September 30, 2026 · 8 minutes</div>
            </div>
            <i class="moin-chevron"></i>
          </a>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
