<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roadmap</title>
  <link rel="stylesheet" href="../moin.css">
  <script src="../moin.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="moin-bar">
    <div class="moin-page moin-bar-inner">
      <a href="#" class="moin-row" data-gap="2" aria-label="Home">
        <span class="moin-heading">Acme</span>
      </a>
      <span class="moin-fill"></span>
      <button type="button" class="moin-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="moin-icon moin-icon-theme"></i>
      </button>
      <span class="moin-avatar">
        <span aria-hidden="true">AL</span>
        <span class="moin-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="moin-page moin-content">
      <!-- Title -->
      <header class="moin-header">
        <div class="moin-header-main">
          <h1 class="moin-title">Roadmap</h1>
        </div>
      </header>
      <!-- Cards -->
      <div class="moin-grid" data-cols="3">
        <section class="moin-card">
          <div class="moin-card-head">
            <h2 class="moin-heading">Now</h2>
          </div>
          <ol class="moin-timeline">
            <li>
              <span class="moin-strong">Teams</span>
              <span class="moin-small moin-muted">Shipping in November</span>
            </li>
            <li>
              <span class="moin-strong">Audit log</span>
              <span class="moin-small moin-muted">In review</span>
            </li>
          </ol>
        </section>
        <section class="moin-card">
          <div class="moin-card-head">
            <h2 class="moin-heading">Next</h2>
          </div>
          <ol class="moin-timeline">
            <li>
              <span class="moin-strong">Webhooks</span>
              <span class="moin-small moin-muted">December</span>
            </li>
            <li>
              <span class="moin-strong">Single sign-on</span>
              <span class="moin-small moin-muted">January</span>
            </li>
          </ol>
        </section>
        <section class="moin-card">
          <div class="moin-card-head">
            <h2 class="moin-heading">Later</h2>
          </div>
          <ol class="moin-timeline">
            <li>
              <span class="moin-strong">Mobile app</span>
              <span class="moin-small moin-muted">Next year</span>
            </li>
          </ol>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
