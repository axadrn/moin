<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docs</title>
  <link rel="stylesheet" href="../moin.css">
  <script src="../moin.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="moin-bar">
    <div class="moin-page moin-bar-inner">
      <a href="#" class="moin-row" data-gap="2" aria-label="Home">
        <span class="moin-heading">Acme</span>
      </a>
      <span class="moin-fill"></span>
      <button type="button" class="moin-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="moin-icon moin-icon-theme"></i>
      </button>
      <span class="moin-avatar">
        <span aria-hidden="true">AL</span>
        <span class="moin-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="moin-page moin-content">
      <div class="moin-grid" data-cols="1-2">
        <div class="moin-section">
          <div class="moin-section-head">
            <h2>Get started</h2>
          </div>
          <section class="moin-card">
            <div class="moin-list">
              <a href="#docs" class="moin-item" aria-current="page">
                <div class="moin-item-text">
                  <div class="moin-item-name">Install</div>
                </div>
              </a>
              <a href="#docs" class="moin-item">
                <div class="moin-item-text">
                  <div class="moin-item-name">First deploy</div>
                </div>
              </a>
              <a href="#docs" class="moin-item">
                <div class="moin-item-text">
                  <div class="moin-item-name">Domains</div>
                </div>
              </a>
            </div>
          </section>
        </div>
        <article class="moin-prose">
          <h1>Install</h1>
          <p>One command on your server, and you are done.</p>
          <pre><code>curl -fsSL https://example.com/install | sh</code></pre>
          <h2>What it does</h2>
          <ul>
            <li>Adds one binary</li>
            <li>Starts one service</li>
            <li>Changes nothing else</li>
          </ul>
        </article>
      </div>
    </section>
  </main>
