<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up</title>
  <link rel="stylesheet" href="../moin.css">
  <script src="../moin.js"></script>
</head>
<body>
  <main>
    <section class="moin-centered">
      <!-- Logo -->
      <header class="moin-page">
        <span class="moin-heading">acme</span>
      </header>
      <!-- Create your account -->
      <div>
        <div>
          <h1 class="moin-title moin-center">Create your account</h1>
          <div class="moin-stack" data-gap="3">
            <div class="moin-field">
              <label for="signup-name">Name</label>
              <input id="signup-name" class="moin-input" autocomplete="off">
            </div>
            <div class="moin-field">
              <label for="signup-email">Email</label>
              <input id="signup-email" class="moin-input" type="email" placeholder="ada@example.com" autocomplete="off">
            </div>
            <button type="button" class="moin-button" data-kind="primary">Create account</button>
          </div>
          <p class="moin-small moin-muted moin-center">Already have one? <a href="#signin">Sign in</a></p>
        </div>
      </div>
      <!-- Footer -->
      <footer>
        <a href="#signup">Terms</a>
        <a href="#signup">Privacy</a>
      </footer>
    </section>
  </main>
</body>
</html>
