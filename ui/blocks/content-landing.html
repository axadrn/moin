<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing</title>
  <link rel="stylesheet" href="../moin.css">
  <script src="../moin.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="moin-bar">
    <div class="moin-page moin-bar-inner">
      <a href="#" class="moin-row" data-gap="2" aria-label="Home">
        <span class="moin-heading">Acme</span>
      </a>
      <span class="moin-fill"></span>
      <button type="button" class="moin-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="moin-icon moin-icon-theme"></i>
      </button>
      <span class="moin-avatar">
        <span aria-hidden="true">AL</span>
        <span class="moin-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="moin-page moin-content">
      <!-- Hero -->
      <div class="moin-stack moin-center" data-gap="3">
        <h1 class="moin-title">Ship your work, not your tools.</h1>
        <p class="moin-muted">Everything your team needs, on one calm page.</p>
        <div class="moin-row" data-gap="2" data-wrap data-center>
          <button type="button" class="moin-button" data-kind="primary">Get started</button>
          <button type="button" class="moin-button">Read the docs</button>
        </div>
      </div>
      <!-- Cards -->
      <div class="moin-grid" data-cols="3">
        <section class="moin-card">
          <h2 class="moin-heading">Fast</h2>
          <p class="moin-text moin-muted">Pages that load before you notice.</p>
        </section>
        <section class="moin-card">
          <h2 class="moin-heading">Simple</h2>
          <p class="moin-text moin-muted">Nothing to learn, nothing to set up.</p>
        </section>
        <section class="moin-card">
          <h2 class="moin-heading">Yours</h2>
          <p class="moin-text moin-muted">Your data stays on your servers.</p>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
