<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog</title>
  <link rel="stylesheet" href="../moin.css">
  <script src="../moin.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="moin-bar">
    <div class="moin-page moin-bar-inner">
      <a href="#" class="moin-row" data-gap="2" aria-label="Home">
        <span class="moin-heading">Acme</span>
      </a>
      <span class="moin-fill"></span>
      <button type="button" class="moin-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="moin-icon moin-icon-theme"></i>
      </button>
      <span class="moin-avatar">
        <span aria-hidden="true">AL</span>
        <span class="moin-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="moin-page moin-content">
      <!-- Title -->
      <header class="moin-header">
        <div class="moin-header-back">
          <a href="#apps" class="moin-back">Apps</a>
        </div>
        <div class="moin-header-main">
          <h1 class="moin-title">Catalog</h1>
        </div>
      </header>
      <!-- Search -->
      <input class="moin-input" type="search" placeholder="Find an app to install" aria-label="Find an app to install">
      <!-- Cards -->
      <div class="moin-grid">
        <div class="moin-list">
          <a href="#catalog" class="moin-item">
            <span data-lead class="moin-logo">P</span>
            <div class="moin-item-text">
              <div class="moin-item-name">Plausible</div>
              <div class="moin-item-note">Web analytics</div>
            </div>
            <i class="moin-chevron"></i>
          </a>
          <a href="#catalog" class="moin-item">
            <span data-lead class="moin-logo">G</span>
            <div class="moin-item-text">
              <div class="moin-item-name">Ghost</div>
              <div class="moin-item-note">Publishing</div>
            </div>
            <i class="moin-chevron"></i>
          </a>
          <a href="#catalog" class="moin-item">
            <span data-lead class="moin-logo">N</span>
            <div class="moin-item-text">
              <div class="moin-item-name">n8n</div>
              <div class="moin-item-note">Workflows</div>
            </div>
            <i class="moin-chevron"></i>
          </a>
        </div>
        <div class="moin-list">
          <a href="#catalog" class="moin-item">
            <span data-lead class="moin-logo">M</span>
            <div class="moin-item-text">
              <div class="moin-item-name">Metabase</div>
              <div class="moin-item-note">Charts from your data</div>
            </div>
            <i class="moin-chevron"></i>
          </a>
          <a href="#catalog" class="moin-item">
            <span data-lead class="moin-logo">U</span>
            <div class="moin-item-text">
              <div class="moin-item-name">Umami</div>
              <div class="moin-item-note">Web analytics</div>
            </div>
            <i class="moin-chevron"></i>
          </a>
          <a href="#catalog" class="moin-item">
            <span data-lead class="moin-logo">V</span>
            <div class="moin-item-text">
              <div class="moin-item-name">Vaultwarden</div>
              <div class="moin-item-note">Passwords</div>
            </div>
            <i class="moin-chevron"></i>
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
