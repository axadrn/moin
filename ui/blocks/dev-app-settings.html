<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App settings</title>
  <link rel="stylesheet" href="../moin.css">
  <script src="../moin.js"></script>
</head>
<body>
  <!-- Top bar -->
  <header class="moin-bar">
    <div class="moin-page moin-bar-inner">
      <a href="#" class="moin-row" data-gap="2" aria-label="Home">
        <span class="moin-heading">Acme</span>
      </a>
      <span class="moin-fill"></span>
      <button type="button" class="moin-button" data-icon data-quiet aria-label="Switch the theme" data-mode-toggle>
        <i class="moin-icon moin-icon-theme"></i>
      </button>
      <span class="moin-avatar">
        <span aria-hidden="true">AL</span>
        <span class="moin-sr-only">Ada Lovelace</span>
      </span>
    </div>
  </header>
  <main>
    <section class="moin-page moin-content">
      <!-- Title -->
      <header class="moin-header">
        <div class="moin-header-back">
          <a href="#app" class="moin-back">my-app</a>
        </div>
        <div class="moin-header-main">
          <h1 class="moin-title">Settings</h1>
          <div class="moin-header-actions">
            <span class="moin-text moin-muted">2 changes waiting</span>
            <button type="button" class="moin-button" data-kind="primary">Restart</button>
          </div>
        </div>
      </header>
      <!-- App -->
      <div class="moin-section">
        <div class="moin-section-head">
          <h2>App</h2>
        </div>
        <section class="moin-card">
          <div class="moin-list">
            <a href="#app-settings" class="moin-item">
              <div class="moin-item-text">
                <div class="moin-item-name">Name</div>
              </div>
              <span class="moin-item-value">my-app</span>
              <i class="moin-chevron"></i>
            </a>
            <a href="#app-settings" class="moin-item">
              <div class="moin-item-text">
                <div class="moin-item-name">Repository</div>
              </div>
              <span class="moin-item-value">acme/my-app</span>
              <i class="moin-chevron"></i>
            </a>
            <div class="moin-item" data-control>
              <label for="pin" class="moin-item-text">
                <span class="moin-item-name">Pin to the top</span>
              </label>
              <span class="moin-switch">
                <input id="pin" type="checkbox" role="switch" autocomplete="off" checked>
                <span></span>
              </span>
            </div>
            <div class="moin-item" data-control>
              <label for="auto" class="moin-item-text">
                <span class="moin-item-name">Deploy on push</span>
                <span class="moin-item-note">main</span>
              </label>
              <span class="moin-switch">
                <input id="auto" type="checkbox" role="switch" autocomplete="off">
                <span></span>
              </span>
            </div>
          </div>
        </section>
      </div>
      <!-- Environment -->
      <div class="moin-section">
        <div class="moin-section-head">
          <h2>Environment</h2>
          <div class="moin-choice" role="radiogroup" aria-label="Edit as" data-size="s">
            <label><input type="radio" name="env" checked>Text</label>
            <label><input type="radio" name="env">Fields</label>
          </div>
        </div>
        <form class="moin-card">
          <textarea class="moin-textarea" aria-label="Environment" spellcheck="false">PORT=8080
  LOG_LEVEL=info
  DATABASE_URL=postgres://postgres-db:5432/app</textarea>
          <div class="moin-row" data-end>
            <button type="button" class="moin-button" data-kind="primary" onclick="this.dataset.done='';setTimeout(()=>delete this.dataset.done,1600)">
              <span>Save</span>
            </button>
          </div>
        </form>
      </div>
      <!-- List -->
      <section class="moin-card">
        <div class="moin-list">
          <button type="button" class="moin-item" data-danger data-confirm="Stop my-app? It goes offline until you start it.">
            <span class="moin-strong">Stop</span>
          </button>
          <button type="button" class="moin-item" data-danger data-confirm="Remove my-app? Its data goes too. This cannot be undone." data-confirm-name="my-app">
            <span class="moin-strong">Remove</span>
          </button>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
