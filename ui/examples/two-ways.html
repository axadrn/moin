<form class="moin-stack" data-gap="4" data-either>
  <div class="moin-choice" role="radiogroup" aria-label="Pay">
    <label><input type="radio" name="demo-pay" value="yearly" checked>Yearly</label>
    <label><input type="radio" name="demo-pay" value="monthly" data-other>Monthly</label>
  </div>
  <p class="moin-number" data-way="first">€60 a year</p>
  <p class="moin-number" data-way="other">€6 a month</p>
  <p class="moin-text moin-muted">Cancel any time.</p>
</form>
