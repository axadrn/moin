<section class="moin-card">
  <div class="moin-field">
    <div class="moin-row" data-between>
      <span class="moin-text moin-strong">Disk</span>
      <span class="moin-text moin-muted moin-digits">91%</span>
    </div>
    <div class="moin-meter" data-state="failed" role="meter" aria-valuenow="91" aria-valuemin="0" aria-valuemax="100" aria-label="Disk" data-tip="36.4 GB of 40 GB">
      <span style="--value:91%"></span>
    </div>
  </div>
  <div class="moin-field">
    <div class="moin-row" data-between>
      <span class="moin-text moin-strong">Memory</span>
      <span class="moin-text moin-muted moin-digits">48%</span>
    </div>
    <div class="moin-meter" role="meter" aria-valuenow="48" aria-valuemin="0" aria-valuemax="100" aria-label="Memory" data-tip="3.8 GB of 8 GB">
      <span style="--value:48%"></span>
    </div>
  </div>
  <div class="moin-field">
    <div class="moin-row" data-between>
      <span class="moin-text moin-strong">Uptime, 30 days</span>
      <span class="moin-text moin-muted moin-digits">99.8%</span>
    </div>
    <div class="moin-history" role="img" aria-label="30 days, one with an outage" >
      <i data-tip="Oct 10 · 100%"></i>
      <i data-tip="Oct 11 · 100%"></i>
      <i data-tip="Oct 12 · 100%"></i>
      <i data-tip="Oct 13 · 100%"></i>
      <i data-tip="Oct 14 · 100%"></i>
      <i data-tip="Oct 15 · 100%"></i>
      <i data-tip="Oct 16 · 100%"></i>
      <i data-tip="Oct 17 · 100%"></i>
      <i data-tip="Oct 18 · 100%"></i>
      <i data-tip="Oct 19 · 100%"></i>
      <i data-tip="Oct 20 · 100%"></i>
      <i data-tip="Oct 21 · 100%"></i>
      <i data-tip="Oct 22 · 100%"></i>
      <i data-tip="Oct 23 · 100%"></i>
      <i data-tip="Oct 24 · 100%"></i>
      <i data-tip="Oct 25 · 100%"></i>
      <i data-tip="Oct 26 · 100%"></i>
      <i data-tip="Oct 27 · 100%"></i>
      <i data-tip="Oct 28 · 100%"></i>
      <i data-tip="Oct 29 · 100%"></i>
      <i data-tip="Oct 30 · 100%"></i>
      <i data-state="failed" data-tip="Oct 31 · down 48m"></i>
      <i data-tip="Nov 1 · 100%"></i>
      <i data-tip="Nov 2 · 100%"></i>
      <i data-tip="Nov 3 · 100%"></i>
      <i data-tip="Nov 4 · 100%"></i>
      <i data-tip="Nov 5 · 100%"></i>
      <i data-tip="Nov 6 · 100%"></i>
      <i data-tip="Nov 7 · 100%"></i>
      <i data-tip="Nov 8 · 100%"></i>
    </div>
  </div>
  <div class="moin-row" data-between>
    <span class="moin-text moin-strong">Requests</span>
    <moin-spark values="12,18,14,22,30,26,34,40,36,48" unit=" req/s"></moin-spark>
  </div>
</section>
