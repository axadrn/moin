<section class="moin-card">
  <div class="moin-list">
    <button type="button" class="moin-item">
      <span class="moin-strong">Back up now</span>
    </button>
    <button type="button" class="moin-item" data-danger data-confirm="Stop my-app? It goes offline until you start it.">
      <span class="moin-strong">Stop</span>
    </button>
    <button type="button" class="moin-item" data-danger data-confirm="Remove my-app? This cannot be undone." data-confirm-name="my-app">
      <span class="moin-strong">Remove</span>
    </button>
  </div>
</section>
