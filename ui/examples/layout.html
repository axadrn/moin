<div class="moin-stack" data-gap="4">
  <div class="moin-stack" data-gap="2">
    <span class="moin-badge">moin-stack</span>
    <span class="moin-badge">under each other</span>
  </div>
  <div class="moin-row" data-gap="2">
    <span class="moin-badge">moin-row</span>
    <span class="moin-badge">next to each other</span>
    <span class="moin-badge moin-end">moin-end</span>
  </div>
  <div class="moin-row" data-gap="2">
    <span class="moin-badge">left</span>
    <span class="moin-badge moin-fill moin-center">moin-fill takes the rest</span>
    <span class="moin-badge">right</span>
  </div>
  <div class="moin-row" data-baseline data-gap="2">
    <span class="moin-number">96</span>
    <span class="moin-small moin-muted">data-baseline</span>
  </div>
  <div class="moin-row" data-top data-gap="2">
    <span class="moin-badge">data-top</span>
    <span class="moin-small moin-muted">A taller neighbor,<br>and this stays at the top.</span>
  </div>
  <div class="moin-grid" data-fit data-gap="2" style="--min:6rem">
    <span class="moin-badge">moin-grid</span>
    <span class="moin-badge">as many</span>
    <span class="moin-badge">as fit</span>
  </div>
  <div class="moin-hidden-phone">
    <span class="moin-badge">moin-hidden-phone</span>
  </div>
  <div class="moin-only-phone">
    <span class="moin-badge">moin-only-phone</span>
  </div>
</div>
