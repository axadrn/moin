<div class="moin-grid">
  <section class="moin-card">
    <div class="moin-card-head">
      <h2 class="moin-heading">A card</h2>
    </div>
    <p class="moin-text moin-muted">A fact, never a sentence about the UI.</p>
  </section>
  <section class="moin-card">
    <div class="moin-card-head">
      <h2 class="moin-heading">With an action</h2>
      <button type="button" class="moin-button">Edit</button>
    </div>
    <div class="moin-command">
      <code>moin deploy my-app</code>
      <button type="button" class="moin-copy" data-copy="moin deploy my-app" aria-label="Copy the command">
        <i class="moin-icon moin-icon-copy"></i>
      </button>
    </div>
  </section>
  <form class="moin-card">
    <div class="moin-card-head">
      <div class="moin-stack" data-gap="1">
        <h2 class="moin-heading">With a line and a foot</h2>
        <p class="moin-small moin-muted">Links to the old name stop working.</p>
      </div>
    </div>
    <div class="moin-field">
      <label for="demo-card-name">Name</label>
      <input id="demo-card-name" class="moin-input" value="my-app">
    </div>
    <div class="moin-card-foot">
      <button type="button" class="moin-button">Cancel</button>
      <button type="button" class="moin-button" data-kind="primary">Save</button>
    </div>
  </form>
  <section class="moin-card">
    <span class="moin-small moin-muted">Just a number</span>
    <span class="moin-number">96 MB</span>
  </section>
</div>
