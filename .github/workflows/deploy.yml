name: Deploy

# One way to ship, for a release tag and by hand (Actions, Deploy, Run
# workflow):
#   1. test: the same checks as CI.
#   2. box: build the control plane image, ghcr.io/axadrn/moin, which
#      the hosted control plane and every self-hoster runs.
#   3. release: for a tag, the GitHub release with its notes from
#      controlplane/content/changelog.md.
#   4. deploy: through Tailscale, the hosted control plane gets the deploy
#      files of this commit and runs update.sh with the new box.
# A push to main runs nothing. Forks only build: the deploy runs in
# axadrn/moin alone, with the repository variables DEPLOY_HOST and
# TS_CLIENT_ID. No secret passes through GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  box:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A tag is the version, stable and latest; main by hand is latest.
      - name: Tags
        id: tags
        run: |
          image=ghcr.io/axadrn/moin
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "image=${image}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "tags=${image}:${GITHUB_REF_NAME},${image}:stable,${image}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "image=${image}:main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "tags=${image}:latest,${image}:main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: box
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The notes are the tag's section of the changelog, without its date.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="## $TAG" '$0 == tag { on = 1; next } on && /^## / { exit } on' controlplane/content/changelog.md | sed '1,3d' > notes.md
          if [ ! -s notes.md ]; then
            echo "controlplane/content/changelog.md has no section $TAG" >&2
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 && gh release edit "$TAG" --notes-file notes.md || gh release create "$TAG" --title "$TAG" --notes-file notes.md --latest

  deploy:
    needs: box
    if: github.repository == 'axadrn/moin'
    runs-on: ubuntu-24.04
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      TS_CLIENT_ID: ${{ vars.TS_CLIENT_ID }}
    steps:
      - name: Check the variables
        run: |
          if [ -z "$HOST" ] || [ -z "$TS_CLIENT_ID" ]; then
            echo "set the repository variables DEPLOY_HOST and TS_CLIENT_ID (Settings, Secrets and variables, Actions, Variables)" >&2
            exit 1
          fi
      - name: Connect to the server through Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ env.TS_CLIENT_ID }}
          audience: api.tailscale.com/${{ env.TS_CLIENT_ID }}
          tags: tag:ci
          ping: ${{ env.HOST }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Update the server
        env:
          IMAGE: ${{ needs.box.outputs.image }}
        run: |
          tailscale ssh "root@$HOST" "mkdir -p /opt/moin"
          for file in compose.yml compose.same-server.yml update.sh updater.sh setup.sh; do
            tailscale ssh "root@$HOST" "cat > /opt/moin/$file" < "controlplane/deploy/$file"
          done
          tailscale ssh "root@$HOST" "cd /opt/moin && MOIN_IMAGE='$IMAGE' sh update.sh"
      - name: Wait until it answers
        run: |
          for attempt in $(seq 30); do
            tailscale ssh "root@$HOST" "curl --fail --silent --output /dev/null http://127.0.0.1:8090/healthz" && exit 0
            sleep 5
          done
          echo "the control plane on $HOST does not answer" >&2
          exit 1
