name: Deploy

# One way to ship, for a release tag and by hand (Actions, Deploy, Run
# workflow):
#   1. test: the same checks as CI.
#   2. box: build the hub image, ghcr.io/axadrn/moin, which
#      the hosted hub and every self-hoster runs. For a tag only as a
#      candidate, which no hub pulls.
#   3. release: for a tag, after a maintainer approves, the GitHub release
#      with its notes from hub/content/changelog.md, the signed binaries
#      and the signed digest of the hub image; then the image gets its
#      version, stable and latest.
#   4. deploy: through Tailscale, the hosted hub gets the deploy
#      files of this commit and runs update.sh with the new box.
# Only main and tags ship: run by hand on another branch, it does nothing.
# Forks only build: the deploy runs in axadrn/moin alone, with the
# repository variables DEPLOY_HOST and TS_CLIENT_ID. The one secret is
# RELEASE_SIGNING_KEY in the environment release, which signs releases,
# waits for a maintainer's approval and never reaches the hub.
# Each job gets only the rights it needs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  box:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A release is pushed as candidate-<commit> here; it gets its version,
      # stable and latest only once its signed release is complete
      # (release, below), so no hub pulls a build nobody approved. A deploy
      # by hand is main-<commit> alone. image is the name the release and
      # the deploy use. hub/content/docs/reference/shipping.md
      - name: Tags
        id: tags
        run: |
          image=ghcr.io/axadrn/moin
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "image=${image}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "tags=${image}:candidate-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "version=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "image=${image}:main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "tags=${image}:main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: box
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # RELEASE_SIGNING_KEY lives only in the environment release, which runs
    # for v* tags and waits for a maintainer to approve. Another workflow,
    # or an action someone slipped in, cannot reach the key.
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The binaries of the box, the ones under /download, and SHA256SUMS
      # signed with the release key. SHA256SUMS also names the box by its
      # digest, so the signature covers the exact hub image too. Daemons
      # update from here and check the signature:
      # hub/content/docs/guides/security.md#updates
      - name: Sign the binaries and the image
        env:
          IMAGE: ${{ needs.box.outputs.image }}
          DIGEST: ${{ needs.box.outputs.digest }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "set RELEASE_SIGNING_KEY in the environment release (Settings, Environments, release, Environment secrets)" >&2
            exit 1
          fi
          public=$(printf '%s\n' "$RELEASE_SIGNING_KEY" | openssl pkey -pubout -outform DER | tail -c 32 | base64)
          if ! grep -q "\"$public\"" internal/daemon/update.go; then
            echo "RELEASE_SIGNING_KEY is not one of the release keys in internal/daemon/update.go" >&2
            exit 1
          fi
          docker create --name box "ghcr.io/axadrn/moin@$DIGEST" >/dev/null
          docker cp box:/app/downloads downloads
          printf '%s  %s\n' "${DIGEST#sha256:}" "$IMAGE" >> downloads/SHA256SUMS
          printf '%s\n' "$RELEASE_SIGNING_KEY" | openssl pkeyutl -sign -rawin -inkey /dev/stdin -in downloads/SHA256SUMS -out downloads/SHA256SUMS.sig
      # The notes are the tag's section of the changelog, without its date.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="## $TAG" '$0 == tag { on = 1; next } on && /^## / { exit } on' hub/content/changelog.md | sed '1,3d' > notes.md
          if [ ! -s notes.md ]; then
            echo "hub/content/changelog.md has no section $TAG" >&2
            exit 1
          fi
          # A draft until every file is there: nobody sees a release
          # without its signed binaries.
          gh release view "$TAG" >/dev/null 2>&1 && gh release edit "$TAG" --notes-file notes.md || gh release create "$TAG" --title "$TAG" --notes-file notes.md --draft
          gh release upload "$TAG" downloads/* --clobber
          gh release edit "$TAG" --draft=false --latest
      # Only now hubs see the new version: the image of this release gets
      # its version, stable and latest, the same image by its signed
      # digest, not built again. A plain docker login: the job that holds
      # the signing key runs no action but checkout.
      - name: Stable
        env:
          IMAGE: ${{ needs.box.outputs.image }}
          DIGEST: ${{ needs.box.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$IMAGE" --tag ghcr.io/axadrn/moin:stable --tag ghcr.io/axadrn/moin:latest "ghcr.io/axadrn/moin@$DIGEST"

  # After the release: the hub tells the daemons to update to it, and they
  # take it from there.
  deploy:
    needs: [box, release]
    # A tag deploys only after its release: before, its version has no image.
    if: github.repository == 'axadrn/moin' && !cancelled() && needs.box.result == 'success' && (needs.release.result == 'success' || github.ref_type != 'tag')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      TS_CLIENT_ID: ${{ vars.TS_CLIENT_ID }}
    steps:
      - name: Check the variables
        run: |
          if [ -z "$HOST" ] || [ -z "$TS_CLIENT_ID" ]; then
            echo "set the repository variables DEPLOY_HOST and TS_CLIENT_ID (Settings, Secrets and variables, Actions, Variables)" >&2
            exit 1
          fi
      - name: Connect to the server through Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ env.TS_CLIENT_ID }}
          audience: api.tailscale.com/${{ env.TS_CLIENT_ID }}
          tags: tag:ci
          ping: ${{ env.HOST }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Update the server
        env:
          IMAGE: ${{ needs.box.outputs.image }}
        run: |
          tailscale ssh "root@$HOST" "mkdir -p /opt/moin"
          for file in compose.yml compose.same-server.yml update.sh updater.sh setup.sh; do
            tailscale ssh "root@$HOST" "cat > /opt/moin/$file" < "hub/deploy/$file"
          done
          tailscale ssh "root@$HOST" "cd /opt/moin && MOIN_IMAGE='$IMAGE' sh update.sh"
      - name: Wait until it answers
        run: |
          for attempt in $(seq 30); do
            tailscale ssh "root@$HOST" "curl --fail --silent --output /dev/null http://127.0.0.1:8090/healthz" && exit 0
            sleep 5
          done
          echo "the hub on $HOST does not answer" >&2
          exit 1
